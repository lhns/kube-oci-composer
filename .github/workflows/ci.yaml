name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release workflow can gate on the SAME pipeline rather than
  # re-declaring a subset of it. That subset is how v0.2.0 and v0.2.1 published
  # green while `verify` and `e2e` were red: release ran `make test` only, which
  # passes happily on drifted codegen and a broken e2e.
  workflow_call:

permissions:
  contents: read

# The group name is LITERAL, not ${{ github.workflow }}. Under workflow_call that expression
# resolves to the CALLER's workflow, so ci and e2e both computed "release-<ref>" when the release
# workflow invoked them -- one concurrency group, cancel-in-progress, and the two cancelled each
# other. v0.2.2's first release run died exactly that way: every ci job green, e2e cancelled,
# release skipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Cheap, and covers the failures that make every other job's result
  # meaningless — so nothing else starts until it passes. Everything below is
  # `needs: unit`, which is what stops a broken build from burning e2e minutes.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated output is committed
        # Generated CRDs, RBAC and deepcopy drifting from the source is the failure that is
        # invisible until something behaves differently in a cluster than it does in the repo.
        # It also fails silently across machines: `make generate` uses whatever controller-gen
        # is installed, so a version bump only shows up here. See the Makefile's controller-gen
        # rule for why that is now a version check rather than an existence check.
        run: make verify

      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}
      - run: make integration-test

  lint:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          # Built from source with the toolchain setup-go just installed. The prebuilt binaries
          # lag the Go release, and a linter built with an older Go refuses to parse a go.mod
          # targeting a newer one — which is what broke this job.
          install-mode: goinstall
          version: latest
          # Analysis alone was already at the 1m default, so the outcome depended on runner load
          # rather than on the code. This budget is here to catch a hung linter, not to cap how
          # long linting may legitimately take.
          args: --timeout=5m

  chart:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make chart-lint

      - name: Render the option combinations that have their own code paths
        # `helm lint` renders default values only, so a template that breaks under a
        # non-default combination renders fine here and fails at install time. These are the
        # combinations the chart actually branches on.
        run: |
          set -euo pipefail
          # Both replicas serving requires shared storage; the chart must ACCEPT this.
          helm template t charts/kube-oci-composer \
            --set replicaCount=2 \
            --set operator.storage.shared=true > /dev/null
          # NodePort with a pinned port, as the cluster deployment uses.
          helm template t charts/kube-oci-composer \
            --set service.type=NodePort \
            --set service.nodePort=30500 > /dev/null
          # Persistence + metrics on.
          helm template t charts/kube-oci-composer \
            --set persistence.enabled=true \
            --set persistence.storageClass=cephfs \
            --set persistence.accessMode=ReadWriteMany \
            --set metrics.serviceMonitor.enabled=true > /dev/null

      - name: The chart must REFUSE multiple replicas without shared storage
        # A guard is only a guard if it fails. Asserted here because the failure it prevents —
        # a standby replica serving 404 for content that exists — looks like a registry bug
        # rather than a misconfiguration.
        run: |
          set -euo pipefail
          if helm template t charts/kube-oci-composer \
               --set replicaCount=2 \
               --set operator.storage.shared=false > /dev/null 2>&1; then
            echo "FAIL: the chart rendered replicaCount=2 without shared storage"
            exit 1
          fi
          echo "OK: refused, as intended."

  image:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        # The release workflow is the only other place this Dockerfile is built, and there a
        # failure means a tag is already pushed. Building it here makes that a PR failure.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-composer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lhns/kube-oci-composer:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  trivy-fs:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (sources + go.sum)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,test'
