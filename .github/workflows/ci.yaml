name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release workflow can gate on the SAME pipeline rather than
  # re-declaring a subset of it. That subset is how v0.2.0 and v0.2.1 published
  # green while `verify` and `e2e` were red: release ran `make test` only, which
  # passes happily on drifted codegen and a broken e2e.
  workflow_call:

permissions:
  contents: read

# The group name is LITERAL, not ${{ github.workflow }}. Under workflow_call that expression
# resolves to the CALLER's workflow, so ci and e2e both computed "release-<ref>" when the release
# workflow invoked them -- one concurrency group, cancel-in-progress, and the two cancelled each
# other. v0.2.2's first release run died exactly that way: every ci job green, e2e cancelled,
# release skipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Cheap, and covers the failures that make every other job's result
  # meaningless — so nothing else starts until it passes. Everything below is
  # `needs: unit`, which is what stops a broken build from burning e2e minutes.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated output is committed
        # Generated CRDs, RBAC and deepcopy drifting from the source is the failure that is
        # invisible until something behaves differently in a cluster than it does in the repo.
        # It also fails silently across machines: `make generate` uses whatever controller-gen
        # is installed, so a version bump only shows up here. See the Makefile's controller-gen
        # rule for why that is now a version check rather than an existence check.
        run: make verify

      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}
      - run: make integration-test

  lint:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Built from source with the toolchain setup-go just installed. The prebuilt binaries
          # lag the Go release, and a linter built with an older Go refuses to parse a go.mod
          # targeting a newer one — which is what broke this job.
          install-mode: goinstall
          version: latest
          # Settings live in .golangci.yml now, including the timeout: v9 installs golangci-lint
          # v2, which reads its config from there and needs one anyway (see that file for what the
          # v1 -> v2 default change surfaced).

  chart:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make chart-lint

      - name: Render the option combinations that have their own code paths
        # `helm lint` renders default values only, so a template that breaks under a
        # non-default combination renders fine here and fails at install time. These are the
        # combinations the chart actually branches on.
        run: |
          set -euo pipefail
          # Each component toggled off on its own. imageBuild.enabled=false is the one that matters
          # most: it must remove the RBAC, not just the controller (ADR 0033).
          helm template t charts/kube-oci-composer --set imageComposition.enabled=false > /dev/null
          helm template t charts/kube-oci-composer --set imageBuild.enabled=false > /dev/null
          # No bundled registry: the BYO shape, where the operator supplies a registry and its
          # credential. This has to keep working -- it is the reason defaultRegistry exists
          # separately from registry.
          helm template t charts/kube-oci-composer             --set registry.enabled=false             --set defaultRegistry.host=ghcr.io/example             --set defaultRegistry.existingPushSecret=my-push-secret > /dev/null
          # NodePort with a pinned port plus a node-resolvable host, which is the arrangement a
          # workload actually pulls through.
          helm template t charts/kube-oci-composer             --set registry.service.type=NodePort             --set registry.service.nodePort=30500             --set registry.host=oci.example.com:30500 > /dev/null
          # Persistence, S3 layer cache and metrics on.
          helm template t charts/kube-oci-composer             --set registry.persistence.enabled=true             --set registry.persistence.storageClass=cephfs             --set operator.s3.endpoint=https://s3.test             --set operator.s3.bucket=blobs             --set metrics.serviceMonitor.enabled=true > /dev/null

      - name: imageBuild.enabled=false must remove the Job RBAC, not just the controller
        # A toggle that leaves the Role behind is a setting that LOOKS like a security control and
        # is not one. ADR 0033 accepted a default install that can run arbitrary containers only
        # because turning it off removes the permission.
        run: |
          set -euo pipefail
          if helm template t charts/kube-oci-composer --set imageBuild.enabled=false                | grep -q 'jobs'; then
            echo "FAIL: a rendered role still grants jobs with imageBuild disabled"
            exit 1
          fi
          echo "OK: the RBAC went with the controller."

      - name: The bundled registry renders, and its retention policy protects something
        # Each of the settings checked here fails by silently protecting NOTHING rather than by
        # erroring, which is how they were found: seven e2e runs that read like the registry was
        # broken when the policy simply matched nothing. See ADR 0031 and docs/registry.md.
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          helm template t charts/kube-oci-composer --set registry.auth.password=fixed-for-render > /dev/null
          helm template t charts/kube-oci-composer --set registry.persistence.enabled=false > /dev/null
          helm template t charts/kube-oci-composer | python3 hack/check-bundled-registry.py

      - name: The chart must REFUSE a retention margin too thin to be a guarantee
        # Threat-model gap D7. The window and the refresh interval were unfixable while they lived
        # in different systems; one chart renders both, so it compares them.
        #
        # A guard is only a guard if it fails, and this one is why that rule exists: the first
        # version lived in a _partials file whose `include` Helm never executes, so it passed every
        # falsification case while doing nothing at all.
        run: |
          set -euo pipefail
          if helm template t charts/kube-oci-composer                --set registry.retention.window=2h > /dev/null 2>&1; then
            echo "FAIL: the chart rendered a 2h window against a 1h refresh interval"
            exit 1
          fi
          if helm template t charts/kube-oci-composer                --set operator.retention.refreshInterval=0 > /dev/null 2>&1; then
            echo "FAIL: the chart rendered with refreshing disabled and a window still set"
            exit 1
          fi
          echo "OK: refused, as intended."

  image:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (no push)
        # The release workflow is the only other place this Dockerfile is built, and there a
        # failure means a tag is already pushed. Building it here makes that a PR failure.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-composer:ci
          build-args: |
            CMD=oci-composer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the builder image (no push)
        # Same Dockerfile, other binary. Built here for the same reason: a compile error in
        # cmd/oci-builder must be a PR failure rather than a tag-time one.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-builder:ci
          build-args: |
            CMD=oci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lhns/kube-oci-composer:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  trivy-fs:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (sources + go.sum)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,test'
