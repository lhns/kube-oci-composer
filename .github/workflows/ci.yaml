name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so release gates on this same pipeline rather than a subset of it.
  workflow_call:

permissions:
  contents: read

# A LITERAL group name: under workflow_call ${{ github.workflow }} is the caller's, so ci and e2e
# would share one group when release calls them, and cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY: /manager
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # The cheap gate: every other job `needs: unit`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go

      - name: Verify generated output is committed
        # Generated CRDs, RBAC and deepcopy must match the source and the pinned controller-gen.
        run: make verify

      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}
      - run: make integration-test

  chart:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: make chart-lint

      - name: Render the option combinations that have their own code paths
        # `helm lint` renders defaults only; these are the combinations the chart branches on.
        run: |
          set -euo pipefail
          # publish.mode has no default (ADR 0037) and none of these cases is about it.
          MODE="--set registry.publish.mode=internalOnly"
          # Each component toggled off on its own.
          helm template t charts/kube-oci-composer $MODE --set imageComposition.enabled=false > /dev/null
          helm template t charts/kube-oci-composer $MODE --set imageBuild.enabled=false > /dev/null
          # No bundled registry: bring your own registry and credential.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.enabled=false \
            --set defaultRegistry.host=ghcr.io/example \
            --set defaultRegistry.existingPushSecret=my-push-secret > /dev/null
          # NodePort with a pinned port and a node-resolvable host.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.service.type=NodePort \
            --set registry.service.nodePort=30500 \
            --set registry.host=oci.example.com:30500 > /dev/null
          # Persistence, S3 layer cache and metrics on.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.persistence.enabled=true \
            --set registry.persistence.storageClass=cephfs \
            --set operator.s3.endpoint=https://s3.test \
            --set operator.s3.bucket=blobs \
            --set metrics.serviceMonitor.enabled=true > /dev/null

      - name: imageBuild.enabled=false must remove the Job RBAC, not just the controller
        # ADR 0033 accepts a default install that can run arbitrary containers only because this
        # toggle removes the permission.
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          if helm template t charts/kube-oci-composer $MODE --set imageBuild.enabled=false                | grep -q 'jobs'; then
            echo "FAIL: a rendered role still grants jobs with imageBuild disabled"
            exit 1
          fi
          echo "OK: the RBAC went with the controller."

      - name: The bundled registry renders, and its retention policy protects something
        # Each setting checked here fails by silently protecting nothing rather than by erroring.
        # ADR 0031, docs/registry.md.
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          pip install --quiet pyyaml
          helm template t charts/kube-oci-composer $MODE --set registry.auth.password=fixed-for-render > /dev/null
          helm template t charts/kube-oci-composer $MODE --set registry.persistence.enabled=false > /dev/null
          helm template t charts/kube-oci-composer $MODE | python3 hack/check-bundled-registry.py docs/registry.md

      - name: The chart must REFUSE a retention margin too thin to be a guarantee
        # Threat-model gap D7. Each guard must actually fail the render (a check in a _partials
        # file that nothing includes never runs).
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          if helm template t charts/kube-oci-composer $MODE                --set retention.window=2h --set retention.refreshInterval=1h > /dev/null 2>&1; then
            echo "FAIL: the chart rendered a 2h window against a 1h refresh interval"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set registry.enabled=false --set defaultRegistry.host=ghcr.io/example                --set retention.window=2h --set retention.refreshInterval=1h > /dev/null 2>&1; then
            echo "FAIL: an EXTERNAL registry escaped the margin check, which is the deployment it helps most"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set registry.retention.gcDelay=1s > /dev/null 2>&1; then
            echo "FAIL: a gcDelay shorter than the naming gap rendered; a build's own image is collectable"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set operator.retention.refreshInterval=0 > /dev/null 2>&1; then
            echo "FAIL: the chart rendered with refreshing disabled and a window still set"
            exit 1
          fi
          echo "OK: refused, as intended."

  go-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release image is built with the Go that CI tests
        # The local setup-go action installs the Dockerfile's Go, so CI tests what ships. A minor
        # move is a migration: move go.mod and the Dockerfile together.
        run: |
          mod=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)
          img=$(grep -m1 -oE '^FROM (--platform=[^ ]+ )?golang:[0-9]+[.][0-9]+' Dockerfile | cut -d: -f2)
          if [ -z "$img" ] || [ "$mod" != "$img" ]; then
            echo "go.mod says Go $mod but the Dockerfile builds with golang:${img:-?}"
            exit 1
          fi
          echo "OK: both on Go $mod"
      - name: go.mod's toolchain line names the Dockerfile's Go
        # Minor must match. A patch difference only warns: Dependabot's golang bump edits the
        # Dockerfile alone, and its PR should not go red for that.
        run: |
          tc=$(awk '/^toolchain go/{sub(/^go/, "", $2); print $2}' go.mod)
          img=$(sed -n 's/^FROM .*golang:\([0-9.]*\)@.*/\1/p' Dockerfile)
          [ -n "$tc" ] || { echo "go.mod has no toolchain line"; exit 1; }
          [ -n "$img" ] || { echo "no digest-pinned golang tag found in Dockerfile"; exit 1; }
          if [ "${tc%.*}" != "${img%.*}" ]; then
            echo "go.mod has toolchain go$tc but the Dockerfile builds with golang:$img"
            exit 1
          fi
          [ "$tc" = "$img" ] || echo "::warning::go.mod has toolchain go$tc, the Dockerfile golang:$img; bump the toolchain line"
          echo "OK: toolchain go$tc, golang:$img"

  lint:
    runs-on: ubuntu-latest
    needs: go-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with the installed Go: prebuilt binaries lag Go releases and refuse a newer go.mod.
          install-mode: goinstall
          version: v2.15.0

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (sources, go.sum)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,test'

  # Both platforms, pushed by digest to a throwaway registry and checked with the release's own
  # script, so an arm64 break fails the PR rather than the release.
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: kube-oci-composer
            build-args: CMD=oci-composer
          - image: kube-oci-builder
            build-args: CMD=oci-builder
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host   # the builder must reach the registry service on localhost
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6
      - name: Build both platforms, push by digest to the local registry
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=localhost:5000/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify every platform's binary architecture
        run: bash scripts/check-binary-arch.sh "localhost:5000/${{ matrix.image }}@${{ steps.build.outputs.digest }}" "$BINARY" "$PLATFORMS"
      - name: Build amd64 for the scan (loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ci/${{ matrix.image }}:scan
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci/${{ matrix.image }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  # The check must be able to fail: an image whose arm64 platform carries an x86-64 binary, the
  # shape of the bug it exists for, must be rejected with exit 1 on arm64 and nothing else.
  arch-check-fails:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6
      - name: Build a mislabelled image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bad"
          cat > "$RUNNER_TEMP/bad/Dockerfile" <<'EOF'
          FROM --platform=linux/amd64 busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec AS amd64
          FROM scratch
          ARG BINARY
          COPY --from=amd64 /bin/busybox ${BINARY}
          EOF
          docker buildx build --platform "$PLATFORMS" --build-arg "BINARY=$BINARY" \
            --output type=image,name=localhost:5000/mislabelled,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/bad"
          echo "REF=localhost:5000/mislabelled@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_ENV"
      - name: The check rejects it
        run: |
          set -uo pipefail
          out=$(bash scripts/check-binary-arch.sh "$REF" "$BINARY" "$PLATFORMS" 2>&1); rc=$?
          echo "$out"
          # Exit 2 (tooling) or a failure on amd64 would prove nothing.
          if [ "$rc" -eq 1 ] \
              && grep -q "^ok   linux/amd64:" <<< "$out" \
              && grep -q "^FAIL linux/arm64: .* has e_machine '3e 00', expected 'b7 00'" <<< "$out"; then
            echo "OK: the check failed, and for the right reason"
          else
            echo "::error::check-binary-arch.sh did not reject an arm64 image holding an x86-64 binary (exit $rc)"
            exit 1
          fi
