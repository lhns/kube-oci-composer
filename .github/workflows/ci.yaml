name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so release gates on this same pipeline rather than a subset of it.
  workflow_call:

permissions:
  contents: read

# A LITERAL group name: under workflow_call ${{ github.workflow }} is the caller's, so ci and e2e
# would share one group when release calls them, and cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap gate: every other job `needs: unit`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: The release image is built with the Go that CI tests
        # A composed artifact's bytes depend on the Go that built the release image, which is the
        # Dockerfile's, not go.mod's. They once differed by a minor version unnoticed (ADR 0057).
        # A minor move is a migration: decide about AssemblyVersion, then move both together.
        run: |
          mod=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)
          img=$(grep -m1 -oE '^FROM golang:[0-9]+[.][0-9]+' Dockerfile | cut -d: -f2)
          if [ -z "$img" ] || [ "$mod" != "$img" ]; then
            echo "go.mod says Go $mod but the Dockerfile builds with golang:${img:-?}"
            exit 1
          fi
          echo "OK: both on Go $mod"

      - name: Verify generated output is committed
        # Generated CRDs, RBAC and deepcopy must match the source and the pinned controller-gen.
        run: make verify

      - run: make test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache envtest assets
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}
      - run: make integration-test

  lint:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Built with the installed Go: prebuilt binaries lag Go releases and refuse a newer
          # go.mod. Settings, including the timeout, are in .golangci.yml.
          install-mode: goinstall
          version: latest

  chart:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make chart-lint

      - name: Render the option combinations that have their own code paths
        # `helm lint` renders defaults only; these are the combinations the chart branches on.
        run: |
          set -euo pipefail
          # publish.mode has no default (ADR 0037) and none of these cases is about it.
          MODE="--set registry.publish.mode=internalOnly"
          # Each component toggled off on its own.
          helm template t charts/kube-oci-composer $MODE --set imageComposition.enabled=false > /dev/null
          helm template t charts/kube-oci-composer $MODE --set imageBuild.enabled=false > /dev/null
          # No bundled registry: bring your own registry and credential.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.enabled=false \
            --set defaultRegistry.host=ghcr.io/example \
            --set defaultRegistry.existingPushSecret=my-push-secret > /dev/null
          # NodePort with a pinned port and a node-resolvable host.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.service.type=NodePort \
            --set registry.service.nodePort=30500 \
            --set registry.host=oci.example.com:30500 > /dev/null
          # Persistence, S3 layer cache and metrics on.
          helm template t charts/kube-oci-composer $MODE \
            --set registry.persistence.enabled=true \
            --set registry.persistence.storageClass=cephfs \
            --set operator.s3.endpoint=https://s3.test \
            --set operator.s3.bucket=blobs \
            --set metrics.serviceMonitor.enabled=true > /dev/null

      - name: imageBuild.enabled=false must remove the Job RBAC, not just the controller
        # ADR 0033 accepts a default install that can run arbitrary containers only because this
        # toggle removes the permission.
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          if helm template t charts/kube-oci-composer $MODE --set imageBuild.enabled=false                | grep -q 'jobs'; then
            echo "FAIL: a rendered role still grants jobs with imageBuild disabled"
            exit 1
          fi
          echo "OK: the RBAC went with the controller."

      - name: The bundled registry renders, and its retention policy protects something
        # Each setting checked here fails by silently protecting nothing rather than by erroring.
        # ADR 0031, docs/registry.md.
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          pip install --quiet pyyaml
          helm template t charts/kube-oci-composer $MODE --set registry.auth.password=fixed-for-render > /dev/null
          helm template t charts/kube-oci-composer $MODE --set registry.persistence.enabled=false > /dev/null
          helm template t charts/kube-oci-composer $MODE | python3 hack/check-bundled-registry.py docs/registry.md

      - name: The chart must REFUSE a retention margin too thin to be a guarantee
        # Threat-model gap D7. Each guard must actually fail the render (a check in a _partials
        # file that nothing includes never runs).
        run: |
          set -euo pipefail
          MODE="--set registry.publish.mode=internalOnly"
          if helm template t charts/kube-oci-composer $MODE                --set retention.window=2h --set retention.refreshInterval=1h > /dev/null 2>&1; then
            echo "FAIL: the chart rendered a 2h window against a 1h refresh interval"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set registry.enabled=false --set defaultRegistry.host=ghcr.io/example                --set retention.window=2h --set retention.refreshInterval=1h > /dev/null 2>&1; then
            echo "FAIL: an EXTERNAL registry escaped the margin check, which is the deployment it helps most"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set registry.retention.gcDelay=1s > /dev/null 2>&1; then
            echo "FAIL: a gcDelay shorter than the naming gap rendered; a build's own image is collectable"
            exit 1
          fi
          if helm template t charts/kube-oci-composer $MODE                --set operator.retention.refreshInterval=0 > /dev/null 2>&1; then
            echo "FAIL: the chart rendered with refreshing disabled and a window still set"
            exit 1
          fi
          echo "OK: refused, as intended."

  image:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (no push)
        # Otherwise only release builds it, after the tag is pushed.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-composer:ci
          build-args: |
            CMD=oci-composer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the builder image (no push)
        # Same Dockerfile, other binary, same reason.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-builder:ci
          build-args: |
            CMD=oci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lhns/kube-oci-composer:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  trivy-fs:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (sources + go.sum)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,test'
