name: e2e

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so release gates on the e2e itself.
  workflow_call:

permissions:
  contents: read

# A LITERAL group name: under workflow_call ${{ github.workflow }} is the caller's, so ci and e2e
# would share one group when release calls them, and cancel each other.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both images, built once with the layer cache ci's image job fills.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Tags must match up.sh's defaults: the chart installs with pullPolicy=Never (up.sh checks
      # every node has both after loading).
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-composer:e2e
          build-args: |
            CMD=oci-composer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-oci-builder:e2e
          build-args: |
            CMD=oci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # One archive holding both, so one upload, one download and one `kind load`.
      - run: docker save -o e2e-images.tar ghcr.io/lhns/kube-oci-composer:e2e ghcr.io/lhns/kube-oci-builder:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: e2e-images.tar
          retention-days: 1

  e2e:
    needs: images
    runs-on: ubuntu-latest
    # The job takes about 15 minutes, mostly waiting on the registry's collector; the test binary
    # has its own 30m cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          # Pinned WITH the node image: older kind cannot read the 1.36 image's containerd config
          # ("unknown containerd config version: 4"). Move the two together.
          version: v0.32.0
          # Image volumes need containerd >= 2.1 as well as kubelet support; on older runtimes the
          # pod runs with the volume silently unmounted. 1.36 matches production (containerd 2.3).
          node_image: kindest/node:v1.36.1
          cluster_name: kube-oci-composer-e2e
          # kind-action creates the cluster (up.sh's `kind create` is skipped), so the containerd
          # config_path patch for up.sh's certs.d drop-in must come in through here.
          config: test/e2e/kind-config.yaml

      - name: Record what the runtime actually is
        # Printed always: the runtime version is the first thing to check when image volumes fail.
        run: kubectl get nodes -o wide
      - uses: azure/setup-helm@v5

      # After the cluster exists, before e2e-up loads from it.
      - uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      # Loads the images, installs the chart, and waits for the controllers.
      - run: make e2e-up
        env:
          CLUSTER: kube-oci-composer-e2e
          E2E_IMAGE_ARCHIVE: ${{ runner.temp }}/e2e-images/e2e-images.tar

      - run: make e2e-test

      - name: Diagnostics on failure
        # The usual failures (a pod never ready, an object never published) need more than a log.
        if: failure()
        run: |
          echo "===== pods ====="
          kubectl get pods -A -o wide || true
          echo "===== events ====="
          kubectl get events --sort-by='.lastTimestamp' -A | tail -100 || true
          echo "===== imagecompositions ====="
          kubectl get imagecomposition -A -o yaml || true
          echo "===== consumer pod (did the image volume survive admission?) ====="
          # With ImageVolume off the apiserver STRIPS spec.volumes[].image instead of rejecting.
          kubectl -n oci-composer-e2e get pod consumer -o yaml || true
          echo "===== controller logs ====="
          kubectl -n oci-composer logs deploy/kube-oci-composer --tail=300 || true
          echo "===== controller logs (previous container) ====="
          kubectl -n oci-composer logs deploy/kube-oci-composer --previous --tail=100 || true
          echo "===== builder ====="
          kubectl -n oci-composer logs deploy/kube-oci-composer-builder --tail=300 || true
          echo "===== imagebuilds ====="
          kubectl -n oci-builder-e2e get imagebuilds -o yaml || true
          echo "===== build jobs and pods ====="
          # A BuildKit failure's reason is only here.
          kubectl -n oci-builder-e2e get jobs,pods -o wide || true
          kubectl -n oci-builder-e2e logs -l job-name --tail=300 --all-containers || true
