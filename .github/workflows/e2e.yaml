name: e2e

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release workflow gates on the real e2e rather than trusting that main was
  # green when the tag was cut.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          # The kind CLI is pinned WITH the node image, not independently. kind-action defaults
          # to v0.31.0, which cannot read the containerd config the 1.36 node image ships
          # ("unknown containerd config version: 4") and fails at `kind load`. v0.32.0 is the
          # release that ships kindest/node:v1.36.1 below — keep the two moving together.
          version: v0.32.0
          # Image volumes need BOTH a kubelet that supports them and a container runtime that
          # implements the CRI side. The kubelet half went beta in 1.33, which is why this was
          # pinned there — but the runtime half landed in containerd 2.1, and the 1.33 node image
          # ships containerd 2.0.x. The result was the worst possible failure: the pod was
          # admitted and RAN, the volume was simply never mounted, and the test reported a
          # missing file as though the composer had produced the wrong layout.
          #
          # 1.36 matches the cluster this is deployed on (containerd 2.3.3), so the e2e now
          # exercises the same combination production does.
          node_image: kindest/node:v1.36.1
          cluster_name: kube-oci-composer-e2e
          # kind-action creates the cluster, so up.sh's own `kind create` never runs here — the
          # containerd config_path patch has to be applied through this input or the certs.d
          # drop-in up.sh writes would be read by nothing.
          config: test/e2e/kind-config.yaml

      - name: Record what the runtime actually is
        # Printed on success too. When image volumes silently do not mount, the container runtime
        # version is the first thing worth knowing and the last thing anyone thinks to check.
        run: kubectl get nodes -o wide
      - uses: azure/setup-helm@v4

      # Builds the image, loads it into kind, installs the CRDs and the chart, and waits for the
      # controller to be ready. Without this the test job found no CRD and failed instantly —
      # which it did, on every push, until someone looked.
      - run: make e2e-up
        env:
          CLUSTER: kube-oci-composer-e2e

      - run: make e2e-test

      - name: Diagnostics on failure
        # A bare controller log tail is rarely enough: the common e2e failures here are a pod
        # that never became ready and a composition that never published, and neither leaves a
        # useful trace in the manager log alone.
        if: failure()
        run: |
          echo "===== pods ====="
          kubectl get pods -A -o wide || true
          echo "===== events ====="
          kubectl get events --sort-by='.lastTimestamp' -A | tail -100 || true
          echo "===== imagecompositions ====="
          kubectl get imagecomposition -A -o yaml || true
          echo "===== consumer pod (did the image volume survive admission?) ====="
          # If the ImageVolume feature is off, the apiserver STRIPS spec.volumes[].image rather
          # than rejecting the pod, so this is the only place the truth shows up.
          kubectl -n oci-composer-e2e get pod consumer -o yaml || true
          echo "===== controller logs ====="
          kubectl -n oci-composer logs deploy/kube-oci-composer --tail=300 || true
          echo "===== controller logs (previous container) ====="
          kubectl -n oci-composer logs deploy/kube-oci-composer --previous --tail=100 || true
