name: release

# Two modes, same job:
#   release  - a `v*` tag. Tagged `latest`, gated on the full ci+e2e pipeline, and it creates
#              the GitHub Release.
#   dev      - any other branch push, or run by hand. Published as `sha-<short>` plus a chart
#              `0.0.0-dev.g<short>`, so an unmerged branch can be installed in a real cluster. No
#              GitHub Release.
# Both modes build linux/amd64 and linux/arm64 (cross-compiled, no QEMU). Images are pushed by
# digest, each platform's binary architecture is checked, and only then are the tags applied.
on:
  push:
    tags:     ['v*']
    # Not dependabot's: its runs get a read-only GITHUB_TOKEN and the ghcr push fails with 403.
    branches: ['**', '!dependabot/**']
  workflow_dispatch:

# Cancel superseded DEV runs only. A tag release must never be cancelled part-way: the image can
# already be pushed when the chart has not, which leaves a version that half exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  # write: the last step creates the GitHub Release.
  contents: write
  packages: write

jobs:
  # A release is gated on the full ci and e2e pipelines, reused rather than re-declared, so a
  # tag on a red commit cannot publish. Tags only: for a dev build, a second ci run for the same ref
  # would share ci's cancel-in-progress group and the two would cancel each other.
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  # Upgrading the previous release to this one must rebuild nothing, stall nothing and lose nothing
  # (test/upgrade/run.sh). Every other gate starts from a fresh install.
  upgrade:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/upgrade.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: [ci, e2e, upgrade]
    # always() so skipped gates (dev mode) do not skip this job; the contains() checks still block
    # on a failed or cancelled gate.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version and mode
        id: version
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            {
              echo "mode=release"
              echo "version=${VERSION}"
              echo "extra_tags=ghcr.io/lhns/kube-oci-composer:latest"
              echo "builder_extra_tags=ghcr.io/lhns/kube-oci-builder:latest"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            # Characters an OCI tag may not contain become dashes. The branch tag moves; depend
            # on the sha tag.
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            {
              echo "mode=dev"
              # The g prefix is required: an all-digit sha with a leading zero (0054012) is an
              # invalid numeric semver identifier and the chart push rejects it. Image tags keep
              # the bare sha.
              echo "version=0.0.0-dev.g${SHORT}"
              echo "extra_tags=ghcr.io/lhns/kube-oci-composer:sha-${SHORT},ghcr.io/lhns/kube-oci-composer:${BRANCH}"
              echo "builder_extra_tags=ghcr.io/lhns/kube-oci-builder:sha-${SHORT},ghcr.io/lhns/kube-oci-builder:${BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - id: composer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # By digest, no tag: nothing is tagged until the architecture check passes.
          outputs: type=image,name=ghcr.io/lhns/kube-oci-composer,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CMD=oci-composer
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The builder: same Dockerfile, different CMD.
      - id: builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # By digest, no tag: nothing is tagged until the architecture check passes.
          outputs: type=image,name=ghcr.io/lhns/kube-oci-builder,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CMD=oci-builder
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6

      # The Dockerfile checks the binary it builds; this checks what was pushed, per platform,
      # so a wrong-architecture binary in a platform image cannot get a tag.
      - name: Verify each platform image's binary architecture
        env:
          COMPOSER: ghcr.io/lhns/kube-oci-composer@${{ steps.composer.outputs.digest }}
          BUILDER: ghcr.io/lhns/kube-oci-builder@${{ steps.builder.outputs.digest }}
        run: |
          set -euo pipefail
          declare -A want=([amd64]="3e 00" [arm64]="b7 00")
          for ref in "$COMPOSER" "$BUILDER"; do
            seen=" "
            # Attestation manifests are listed as unknown/unknown; skip them.
            while read -r os arch; do
              [ "$os" = unknown ] && continue
              [ "$os" = linux ] && [ -n "${want[$arch]:-}" ] || { echo "FAIL: $ref has unexpected platform $os/$arch"; exit 1; }
              got=$(crane export --platform "linux/$arch" "$ref" - | tar -xO manager | od -An -tx1 -j18 -N2 | xargs)
              if [ "$got" != "${want[$arch]}" ]; then
                echo "FAIL: $ref linux/$arch manager has e_machine '$got', expected '${want[$arch]}'"
                exit 1
              fi
              echo "OK: $ref linux/$arch e_machine $got"
              seen+="$arch "
            done < <(crane manifest "$ref" | jq -r '.manifests[] | "\(.platform.os) \(.platform.architecture)"')
            for arch in "${!want[@]}"; do
              [[ "$seen" == *" $arch "* ]] || { echo "FAIL: $ref has no linux/$arch image"; exit 1; }
            done
          done

      - name: Tag the verified images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPOSER: ghcr.io/lhns/kube-oci-composer@${{ steps.composer.outputs.digest }}
          BUILDER: ghcr.io/lhns/kube-oci-builder@${{ steps.builder.outputs.digest }}
          COMPOSER_EXTRA_TAGS: ${{ steps.version.outputs.extra_tags }}
          BUILDER_EXTRA_TAGS: ${{ steps.version.outputs.builder_extra_tags }}
        run: |
          set -euo pipefail
          tag() { # <name> <digest ref> <comma-separated extra tags>
            local args=(-t "$1:$VERSION") t
            IFS=, read -ra extra <<< "$3"
            for t in "${extra[@]}"; do [ -z "$t" ] || args+=(-t "$t"); done
            docker buildx imagetools create "${args[@]}" "$2"
          }
          tag ghcr.io/lhns/kube-oci-composer "$COMPOSER" "$COMPOSER_EXTRA_TAGS"
          tag ghcr.io/lhns/kube-oci-builder "$BUILDER" "$BUILDER_EXTRA_TAGS"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Publish the chart as an OCI artifact
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm package charts/kube-oci-composer \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination bin/
          helm push bin/kube-oci-composer-*.tgz oci://ghcr.io/lhns/charts

      - name: Publish the release manifests
        # A flat manifest cannot ask for registry.publish.mode (ADR 0037), so it renders
        # internalOnly and says so at the top.
        run: |
          mkdir -p release
          cat > release/install.yaml <<'HEADER'
          # kube-oci-composer -- rendered with registry.publish.mode=internalOnly.
          #
          # WORKLOADS CANNOT PULL FROM THIS INSTALL AS RENDERED. internalOnly means exactly that:
          # the controllers publish to the bundled registry over cluster DNS, which a kubelet
          # cannot resolve. Everything works except being consumed.
          #
          # To make images pullable, install the CHART instead and choose a mode:
          #
          #   helm install kube-oci-composer oci://ghcr.io/lhns/charts/kube-oci-composer \
          #     --set registry.publish.mode=ingress --set registry.host=oci-composer.example.com
          #
          # See docs/registry.md for nodePort and external.
          HEADER
          helm template kube-oci-composer charts/kube-oci-composer \
            --namespace oci-composer --include-crds \
            --set registry.publish.mode=internalOnly >> release/install.yaml

      # Release mode only; a dev build's deliverable is its image and chart.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.version.outputs.mode == 'release'
        with:
          files: release/install.yaml
          generate_release_notes: true
