name: release

# Two modes, same job:
#   release  - a `v*` tag. Multi-arch, tagged `latest`, gated on the full ci+e2e pipeline,
#              and it creates the GitHub Release.
#   dev      - any other branch push, or run by hand. amd64 only (arm64 under QEMU is slow and
#              unused for dev), published as `sha-<short>` plus a chart `0.0.0-dev.g<short>`, so an
#              unmerged branch can be installed in a real cluster. No GitHub Release.
on:
  push:
    tags:     ['v*']
    # Not dependabot's: its runs get a read-only GITHUB_TOKEN and the ghcr push fails with 403.
    branches: ['**', '!dependabot/**']
  workflow_dispatch:

# Cancel superseded DEV runs only. A tag release must never be cancelled part-way: the image can
# already be pushed when the chart has not, which leaves a version that half exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  # write: the last step creates the GitHub Release.
  contents: write
  packages: write
  id-token: write

jobs:
  # A release is gated on the full ci and e2e pipelines, reused rather than re-declared, so a
  # tag on a red commit cannot publish. Tags only: for a dev build, a second ci run for the same ref
  # would share ci's cancel-in-progress group and the two would cancel each other.
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  # Upgrading the previous release to this one must rebuild nothing, stall nothing and lose nothing
  # (test/upgrade/run.sh). Every other gate starts from a fresh install.
  upgrade:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/upgrade.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: [ci, e2e, upgrade]
    # always() so skipped gates (dev mode) do not skip this job; the contains() checks still block
    # on a failed or cancelled gate.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version and mode
        id: version
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            {
              echo "mode=release"
              echo "version=${VERSION}"
              echo "platforms=linux/amd64,linux/arm64"
              echo "extra_tags=ghcr.io/lhns/kube-oci-composer:latest"
              echo "builder_extra_tags=ghcr.io/lhns/kube-oci-builder:latest"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            # Characters an OCI tag may not contain become dashes. The branch tag moves; depend
            # on the sha tag.
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            {
              echo "mode=dev"
              # The g prefix is required: an all-digit sha with a leading zero (0054012) is an
              # invalid numeric semver identifier and the chart push rejects it. Image tags keep
              # the bare sha.
              echo "version=0.0.0-dev.g${SHORT}"
              echo "platforms=linux/amd64"
              echo "extra_tags=ghcr.io/lhns/kube-oci-composer:sha-${SHORT},ghcr.io/lhns/kube-oci-composer:${BRANCH}"
              echo "builder_extra_tags=ghcr.io/lhns/kube-oci-builder:sha-${SHORT},ghcr.io/lhns/kube-oci-builder:${BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.version.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/lhns/kube-oci-composer:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.extra_tags }}
          build-args: |
            CMD=oci-composer
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The builder: same Dockerfile, different CMD.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.version.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/lhns/kube-oci-builder:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.builder_extra_tags }}
          build-args: |
            CMD=oci-builder
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5

      - name: Publish the chart as an OCI artifact
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm package charts/kube-oci-composer \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination bin/
          helm push bin/kube-oci-composer-*.tgz oci://ghcr.io/lhns/charts

      - name: Publish the release manifests
        # A flat manifest cannot ask for registry.publish.mode (ADR 0037), so it renders
        # internalOnly and says so at the top.
        run: |
          mkdir -p release
          cat > release/install.yaml <<'HEADER'
          # kube-oci-composer -- rendered with registry.publish.mode=internalOnly.
          #
          # WORKLOADS CANNOT PULL FROM THIS INSTALL AS RENDERED. internalOnly means exactly that:
          # the controllers publish to the bundled registry over cluster DNS, which a kubelet
          # cannot resolve. Everything works except being consumed.
          #
          # To make images pullable, install the CHART instead and choose a mode:
          #
          #   helm install kube-oci-composer oci://ghcr.io/lhns/charts/kube-oci-composer \
          #     --set registry.publish.mode=ingress --set registry.host=oci-composer.example.com
          #
          # See docs/registry.md for nodePort and external.
          HEADER
          helm template kube-oci-composer charts/kube-oci-composer \
            --namespace oci-composer --include-crds \
            --set registry.publish.mode=internalOnly >> release/install.yaml

      # Release mode only; a dev build's deliverable is its image and chart.
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.mode == 'release'
        with:
          files: release/install.yaml
          generate_release_notes: true
