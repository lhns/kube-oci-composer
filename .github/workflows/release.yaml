name: release

on:
  push:
    tags: ['v*']

permissions:
  # write, not read: the last step creates a GitHub Release, which needs it. With `read` every
  # other step succeeds — the image and chart are pushed — and only the release object fails,
  # which looks like a broken release when the artifacts are in fact fine.
  contents: write
  packages: write
  id-token: write

jobs:
  # The whole pipeline, reused rather than re-declared. This is the fix for a real hole: release
  # used to run `make test` alone and call that "tests gate the release". `make test` passes on
  # drifted codegen, an unrenderable chart and a broken e2e -- so v0.2.0 and v0.2.1 both published
  # green while the test workflow had been red on every push for a week.
  #
  # kube-vnet instead keeps release test-free and relies on main being green when you tag. That
  # works, but it is a convention rather than a mechanism: nothing stops `git tag` on a red commit.
  # Calling the workflows costs the e2e wall-clock once per release and makes it impossible.
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lhns/kube-oci-composer:${{ steps.version.outputs.version }}
            ghcr.io/lhns/kube-oci-composer:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4

      - name: Publish the chart as an OCI artifact
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm package charts/kube-oci-composer \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination bin/
          helm push bin/kube-oci-composer-*.tgz oci://ghcr.io/lhns/charts

      - name: Publish the release manifests
        run: |
          mkdir -p release
          helm template kube-oci-composer charts/kube-oci-composer \
            --namespace oci-composer --include-crds > release/install.yaml

      - uses: softprops/action-gh-release@v2
        with:
          files: release/install.yaml
          generate_release_notes: true
