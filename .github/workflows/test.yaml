name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated output is committed
        # Generated CRDs, RBAC and deepcopy drifting from the source is the failure that is
        # invisible until something behaves differently in a cluster than it does in the repo.
        run: make verify

      - run: make test

      - name: Integration tests
        run: make integration-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make chart-lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          # Image volumes need a kubelet that supports them. Pinning the node image keeps the
          # e2e honest: if the feature is unavailable the test must fail loudly rather than
          # silently exercise a different code path.
          node_image: kindest/node:v1.33.1
      - run: make e2e-test
