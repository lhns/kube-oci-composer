# kind cluster for the e2e.
#
# Sets containerd's certs.d `config_path`, which must be present when containerd starts. up.sh then
# writes the hosts.toml that points the registry's public name at its NodePort: the kubelet pulls
# image volumes with the NODE's resolver, which cannot resolve cluster DNS names.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  # containerd 2.x form. The old `registry.mirrors` stanza was removed in 2.0 and would be silently
  # ignored.
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
