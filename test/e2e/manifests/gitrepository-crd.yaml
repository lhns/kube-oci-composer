# A minimal stand-in for source-controller's GitRepository.
#
# The e2e cluster does not run Flux, and installing it would test Flux rather than this controller.
# What DockerBuild actually consumes is three fields of the contract — status.artifact.url,
# .digest and .revision — so this declares exactly those and nothing else.
#
# Deliberately NO status subresource: without one, `kubectl apply` can set status directly, which
# is what lets the harness publish an artifact without a controller to do it. A real Flux install
# has the subresource and source-controller writes it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitrepositories.source.toolkit.fluxcd.io
spec:
  group: source.toolkit.fluxcd.io
  names:
    kind: GitRepository
    listKind: GitRepositoryList
    plural: gitrepositories
    singular: gitrepository
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                artifact:
                  type: object
                  properties:
                    url:
                      type: string
                    digest:
                      type: string
                    revision:
                      type: string
