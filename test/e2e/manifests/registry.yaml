# zot, standing in for the registry an operator runs.
#
# Was `registry:2`. Swapped because the retention behaviour this suite has to prove cannot be
# exercised on it at all: CNCF distribution has no retention or expiry, and its garbage collection
# is an offline mark-and-sweep whose own documentation says to run the registry read-only during the
# pass. zot collects online and has configurable retention, which is the property the whole
# registry-backed design rests on.
#
# Plain HTTP, which is why the builder is started with --insecure-registry naming this host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-registry-config
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "1s",
        "gcInterval": "10s",
        "retention": {
          "dryRun": false,
          "delay": "1s",
          "policies": [
            {
              "repositories": ["keepalive-*", "keepalive-**"],
              "deleteUntagged": true,
              "deleteReferrers": true,
              "keepTags": [
                { "patterns": [".*"], "pulledWithin": "20s" }
              ],
              "keepUntagged": { "pulledWithin": "20s" }
            }
          ]
        }
      },
      "http": { "address": "0.0.0.0", "port": "5000" },
      "log": { "level": "info" }
    }
---
# The retention window is 20 SECONDS and collection runs every 10, where a real deployment would use
# 30 days against an hourly refresh. Compressed on purpose: a test that cannot observe a deletion
# inside its own runtime proves only that nothing was deleted, which is exactly what a broken
# retention guarantee also looks like.
#
# keepTags carries an explicit `patterns` of `.*`, and it is NOT optional. zot retains
# `patterns` AND (`pulledWithin` OR ...), so an entry with no patterns matches no tags and every tag
# is a deletion candidate no matter how often it is pulled. That is what it did: the tagged image
# was collected while being pulled every five seconds, and the untagged one survived because
# keepUntagged is a separate rule that was correct.
#
# The policy is otherwise scoped by REPOSITORY rather than by tag pattern, and that is deliberate. A tag
# matching no keepTags entry is a candidate for deletion rather than something retained by default,
# so a `**` policy with a tag pattern would quietly collect every ordinary e2e image and make
# unrelated tests flaky in a way that looks like a controller bug. Repositories outside
# `keepalive-` match no policy at all and are therefore untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-registry}
  template:
    metadata:
      labels: {app: e2e-registry}
    spec:
      containers:
        - name: registry
          # Pinned by digest like every other image this project consumes: a tag is a pointer, and
          # a registry whose behaviour the test suite asserts is the last place to accept a moving
          # one.
          image: ghcr.io/project-zot/zot:v2.1.20@sha256:542e25be4d32e7879c0cfad93492a93c81b1e059cbd2d30d485d4bd567318234
          args: ["serve", "/etc/zot/config.json"]
          ports: [{containerPort: 5000}]
          volumeMounts:
            - {name: config, mountPath: /etc/zot}
            # Ephemeral: storage is thrown away with the cluster.
            - {name: data, mountPath: /var/lib/registry}
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
            initialDelaySeconds: 2
      volumes:
        - {name: config, configMap: {name: e2e-registry-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-registry
spec:
  selector: {app: e2e-registry}
  ports: [{port: 5000, targetPort: 5000}]
