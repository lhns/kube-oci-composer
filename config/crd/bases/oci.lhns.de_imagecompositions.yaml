---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: imagecompositions.oci.lhns.de
spec:
  group: oci.lhns.de
  names:
    kind: ImageComposition
    listKind: ImageCompositionList
    plural: imagecompositions
    shortNames:
    - imgcomp
    singular: imagecomposition
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.artifact.ref
      name: Ref
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Status
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ImageComposition assembles an OCI artifact from content-addressed
          inputs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageCompositionSpec assembles an OCI artifact from content-addressed inputs.

              It cannot execute anything, and that is the entire scope line. Everything expressible here is a
              pure function of its inputs, which is what makes the output digest predictable, the reconcile
              loop convergent, and the provenance exact rather than scanned. Anything needing a compiler
              belongs in ordinary CI. See ADR 0001 and ADR 0016.
            properties:
              base:
                description: Base is the image to build on. Omit for a scratch artifact.
                properties:
                  digest:
                    description: |-
                      Digest pins the exact content. Required, like every other input.

                      It must name a platform-specific manifest, not a multi-architecture index: resolving an
                      index would mean the controller choosing a platform, so the output would stop being a
                      function of the spec. Multi-architecture output is not implemented; when it is, an index
                      here becomes correct because the platform list will come from the spec. See ADR 0015.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  image:
                    description: Image is the repository to pull from, e.g. "quay.io/strimzi/kafka".
                    maxLength: 512
                    type: string
                  secretRef:
                    description: |-
                      SecretRef names a kubernetes.io/dockerconfigjson Secret for pulling, when the base is
                      private. The registry host comes from the Secret's auths map, matched against Image — the
                      same arrangement as a Pod's imagePullSecrets, so no separate registry object is needed.

                      Deliberately not shared with spec.push.secretRef: different registry, different scope, and
                      sending a push-scoped token to wherever the base lives is not a reasonable default.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - digest
                - image
                type: object
              config:
                description: Config for the produced artifact.
                properties:
                  cmd:
                    description: Cmd to set.
                    items:
                      type: string
                    type: array
                  entrypoint:
                    description: Entrypoint to set.
                    items:
                      type: string
                    type: array
                  env:
                    description: |-
                      Env to set, as "KEY=value" entries. Replaces the inherited list rather than merging into
                      it: a per-key merge raises questions about ordering and removal with no obvious answers.
                    items:
                      type: string
                    type: array
                  exposedPorts:
                    description: |-
                      ExposedPorts, e.g. "9092/tcp". Documentation for whoever reads the image; Kubernetes does
                      not consult it.
                    items:
                      type: string
                    type: array
                  inherit:
                    default: false
                    description: |-
                      Inherit takes the base image's config as the starting point: its entrypoint, env, user,
                      working directory, exposed ports and stop signal. Without it the config starts empty.

                      Opt-in rather than automatic. An artifact that is only ever mounted should have an empty
                      config, and silently acquiring a base's entrypoint would be surprising. Fields set below
                      override what is inherited.
                    type: boolean
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to set on the image config.
                    type: object
                  stopSignal:
                    description: StopSignal, e.g. "SIGTERM".
                    maxLength: 32
                    type: string
                  user:
                    description: User to run as, e.g. "1001" or "1001:1001".
                    maxLength: 256
                    type: string
                  volumes:
                    description: Volumes declares paths as volumes in the image config.
                    items:
                      type: string
                    type: array
                  workingDir:
                    description: WorkingDir to start in.
                    maxLength: 4096
                    pattern: ^/
                    type: string
                type: object
              interval:
                default: 1h
                description: |-
                  Interval at which to reconcile. Reconciling is nearly free when nothing has changed: the
                  controller compares a hash of the inputs rather than rebuilding.

                  A POINTER, so that omitting it actually omits it. metav1.Duration is a struct, and
                  `omitempty` does not apply to structs — as a value it always serialised as "0s", which
                  meant the API server saw an explicit zero and the default below never applied.
                type: string
              layers:
                description: |-
                  Layers are ordered filesystem operations applied on top of the base. Later entries overlay
                  earlier ones, exactly as image layers do.
                items:
                  description: |-
                    Layer is one entry in an ordered list of filesystem operations applied on top of the base.

                    Each entry produces exactly one layer, which is what makes the name accurate — the base is
                    hoisted out precisely because it did not satisfy that.

                    Exactly one verb must be set. Source-specific options live inside their verb rather than being
                    smeared across the entry, so there is no field that is meaningful for one source and silently
                    ignored by the rest.
                  properties:
                    configMap:
                      description: ConfigMap turns a ConfigMap's entries into files.
                      properties:
                        name:
                          description: Name of the ConfigMap, in the ImageComposition's
                            namespace.
                          type: string
                        optional:
                          default: false
                          description: |-
                            Optional tolerates the ConfigMap not existing, contributing nothing instead of stalling.
                            Nothing, not an empty layer — an empty layer would still change the output digest.
                          type: boolean
                      required:
                      - name
                      type: object
                    fetch:
                      description: Fetch retrieves content over HTTP(S).
                      properties:
                        digest:
                          description: |-
                            Digest of the fetched bytes. Declared here rather than resolved, because an arbitrary URL
                            is not content-addressed by anything else. A mismatch is terminal. See ADR 0002.
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        subpath:
                          description: |-
                            Subpath selects one directory from inside the archive and strips the prefix. Useful when a
                            release tarball wraps everything in a version-named directory you do not want in the image.
                            A subpath matching nothing is an error rather than a silently empty layer.
                          maxLength: 4096
                          type: string
                        unpack:
                          default: none
                          description: Unpack controls how the bytes become layer
                            content.
                          enum:
                          - none
                          - tar
                          - tar.gz
                          type: string
                        url:
                          description: URL to fetch.
                          maxLength: 2048
                          pattern: ^https?://
                          type: string
                      required:
                      - digest
                      - url
                      type: object
                    mode:
                      description: Mode sets permissions on the contributed files.
                      properties:
                        dir:
                          description: Dir mode for directories, e.g. "0755".
                          pattern: ^0[0-7]{3}$
                          type: string
                        file:
                          description: File mode for regular files, e.g. "0644".
                          pattern: ^0[0-7]{3}$
                          type: string
                      type: object
                    name:
                      description: Name identifies this entry, and appears in messages
                        and provenance.
                      maxLength: 253
                      type: string
                    owner:
                      description: Owner sets uid and gid on the contributed files.
                      properties:
                        gid:
                          default: 0
                          description: GID to set on contributed files.
                          format: int64
                          minimum: 0
                          type: integer
                        uid:
                          default: 0
                          description: UID to set on contributed files.
                          format: int64
                          minimum: 0
                          type: integer
                      type: object
                    remove:
                      description: |-
                        Remove deletes paths inherited from the base or from earlier layers.

                        Implemented as whiteout entries, which is how OCI expresses deletion: the bytes remain in
                        the layer below, so this hides a file rather than reclaiming its space. Paths are absolute
                        and refer to the assembled filesystem.
                      items:
                        maxLength: 4096
                        type: string
                      maxItems: 256
                      minItems: 1
                      type: array
                    sourceRef:
                      description: SourceRef takes content from a Flux source's artifact.
                      properties:
                        kind:
                          description: Kind of the referenced source.
                          enum:
                          - GitRepository
                          - OCIRepository
                          - Bucket
                          type: string
                        name:
                          description: Name of the referenced source.
                          type: string
                        namespace:
                          description: Namespace of the referenced source. Defaults
                            to the ImageComposition's namespace.
                          type: string
                        subpath:
                          description: Subpath selects one directory from the artifact.
                            Defaults to the whole thing.
                          maxLength: 4096
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    to:
                      description: To is the absolute path inside the image this entry's
                        content is placed at.
                      maxLength: 4096
                      pattern: ^/
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of fetch, configMap, sourceRef or remove
                    rule: (has(self.fetch)?1:0) + (has(self.configMap)?1:0) + (has(self.sourceRef)?1:0)
                      + (has(self.remove)?1:0) == 1
                  - message: '''to'' is required for content entries and must be omitted
                      for remove, which takes absolute paths; owner and mode do not
                      apply to remove'
                    rule: 'has(self.remove) ? (!has(self.to) && !has(self.owner) &&
                      !has(self.mode)) : has(self.to)'
                maxItems: 64
                minItems: 1
                type: array
              publish:
                description: |-
                  Publish serves the artifact from the controller's own read-only OCI endpoint. The default
                  mode, needing no registry and no credentials.
                properties:
                  history:
                    description: |-
                      History is how many past builds to keep before garbage collection reclaims their blobs.
                      Defaults to the controller's --gc-keep-builds.

                      Old builds are worth keeping for three independent reasons: reverting a commit must find
                      the old reference still pullable; a pod pinned to one that gets rescheduled must be able
                      to pull it again; and with spec-hash tags a rollback names a tag from an earlier build,
                      which only resolves while that build is retained. Layers are shared between builds, so a
                      generous value costs far less than the count suggests. See ADR 0011.
                    format: int32
                    minimum: 1
                    type: integer
                  immutable:
                    default: true
                    description: |-
                      Immutable refuses to move a tag that already resolves to different content, failing the
                      build instead of changing what the tag means. Defaults to TRUE, because silently
                      remeaning a tag is what leaves nodes running different bytes under one name.

                      Republishing IDENTICAL content is always a no-op regardless of this field, so a steady
                      reconcile loop never trips it — only a real change of meaning does.

                      Set false for a deliberately moving pointer, e.g. tags: [main] repointed at every build.

                      A pointer because the zero value is meaningful: a plain bool with omitempty would drop an
                      explicit `false` on the wire and let the default quietly win.
                    type: boolean
                  name:
                    description: |-
                      Name is the repository path the artifact is served under, e.g. "kafka-tiered-storage"
                      results in <serving-host>/kafka-tiered-storage.
                    type: string
                  tags:
                    description: |-
                      Tags are the tags this build is published under, in order. Optional, and defaulted to
                      nothing: with no tags the artifact is published by digest alone, which is all a workload
                      pinned by image automation needs.

                      The intended use is a SPEC-HASH tag — a hash of the build-determining part of this spec,
                      computed by whatever templates it, written into both this field and the consuming
                      workload's image reference. Because assembly is deterministic (ADR 0016), such a tag
                      identifies the output as precisely as its digest does, and both sides derive it from one
                      source with nothing observing anything at runtime. See ADR 0017.

                      A list, so one build can carry several: a spec-hash tag alongside a readable pointer, or
                      the same hash under more than one algorithm.
                    items:
                      maxLength: 128
                      pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]*$
                      type: string
                    maxItems: 32
                    type: array
                required:
                - name
                type: object
              push:
                description: |-
                  Push publishes to an external registry instead. Use it when the artifact must outlive the
                  cluster, be consumed from outside it, or carry registry-native attestations.
                properties:
                  immutable:
                    default: true
                    description: |-
                      Immutable behaves exactly as on Publish, including the default of true. Identical on both
                      so the field cannot mean different things depending on where it sits — and an external
                      registry is where a silently remeaned tag does the most damage.
                    type: boolean
                  repository:
                    description: Repository is the fully qualified target, e.g. "ghcr.io/example/artifact".
                    type: string
                  secretRef:
                    description: SecretRef names a docker-registry Secret holding
                      push credentials.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                  tags:
                    description: Tags are the tags to push, as described on Publish.Tags.
                      Empty pushes by digest only.
                    items:
                      maxLength: 128
                      pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]*$
                      type: string
                    maxItems: 32
                    type: array
                required:
                - repository
                type: object
              suspend:
                default: false
                description: Suspend halts reconciliation without deleting anything
                  already published.
                type: boolean
            required:
            - layers
            type: object
            x-kubernetes-validations:
            - message: set at most one of push or publish
              rule: '!has(self.push) || !has(self.publish)'
            - message: config.inherit requires a base to inherit from
              rule: '!has(self.config) || !self.config.inherit || has(self.base)'
          status:
            description: ImageCompositionStatus reports what was produced.
            properties:
              artifact:
                description: Artifact describes the published result.
                properties:
                  digest:
                    description: Digest of the published manifest, e.g. "sha256:...".
                      This is the value to pin.
                    type: string
                  lastUpdateTime:
                    description: LastUpdateTime is when this artifact was last published.
                    format: date-time
                    type: string
                  ref:
                    description: |-
                      Ref is the complete pullable reference, including the serving host in serving mode.
                      Surfaced as a printer column so `kubectl get` shows the exact string to use.
                    type: string
                  revision:
                    description: |-
                      Revision is the human-facing "<tag>@<digest>", using the first tag. Just the digest when
                      the build carries no tags.
                    type: string
                  tags:
                    description: |-
                      Tags this artifact is published under, fully qualified. Empty when published by digest
                      only. What a workload should name is a tag chosen by whatever templates the spec, not a
                      value read back from here — see ADR 0017.
                    items:
                      type: string
                    type: array
                type: object
              conditions:
                description: 'Conditions follow kstatus: Ready, Reconciling, Stalled.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              history:
                description: |-
                  History records past builds, newest first, capped at the retention count. It is the live
                  set garbage collection marks from. See ADR 0011.
                items:
                  description: |-
                    BuildRecord is one past build, retained so garbage collection knows what is still live.

                    Kept in status rather than inferred from what is in storage. Inference would mean deciding an
                    object is garbage because nothing appears to point at it, which is exactly the reasoning that
                    deletes live data when the controller's view is incomplete. An explicit record also makes
                    retention visible in `kubectl get -o yaml`.
                  properties:
                    blobs:
                      description: |-
                        Blobs are the config and layer digests this build is composed of. These are the objects
                        garbage collection must not reclaim while this build is retained.
                      items:
                        type: string
                      type: array
                    digest:
                      description: Digest of the manifest.
                      type: string
                    tags:
                      description: |-
                        Tags this build was published under, if any. Replayed after a restart so the references a
                        workload names keep resolving; a build with no tags is still replayed by digest.
                      items:
                        type: string
                      type: array
                    time:
                      description: Time the build was published.
                      format: date-time
                      type: string
                  type: object
                type: array
              inputHash:
                description: |-
                  InputHash summarises everything that determines the output. When it is unchanged and the
                  published artifact still resolves, the controller skips the whole build — no fetch, no
                  assembly, one HEAD. See ADR 0002.
                type: string
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt echoes the reconcile.fluxcd.io/requestedAt annotation, so
                  `flux reconcile` works out of the box.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
