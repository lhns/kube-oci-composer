# Default values for kube-oci-composer.

# replicaCount is deliberately 1, and raising it does NOT scale throughput.
#
# Reconciling runs under leader election, so a second replica is a warm standby that reconciles
# nothing until it wins the lease. It is no longer a STORAGE question -- the registry holds the
# images now (ADR 0035) -- so extra replicas are merely idle rather than dangerous.
replicaCount: 1

image:
  repository: ghcr.io/lhns/kube-oci-composer
  # Empty means use the chart's appVersion, so an upgrade of the chart moves the image with it.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

operator:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # Leader election. On by default: two controllers reconciling the same object would push and
  # re-tag concurrently, which the tag-conflict policy would then read as a genuine conflict.
  leaderElect: true

  storage:
    # Directory holding fetched layer sources, keyed by digest. Always used, even when S3 is
    # configured behind it, because assembly reads local files.
    cacheDir: /var/cache/oci-composer

  # Object storage for the layer cache, and optionally for served blobs.
  #
  # Leave endpoint empty to keep everything local to the pod. With it set, a restart or a
  # reschedule onto another node reuses cached layers instead of re-fetching every one from
  # upstream — which is the difference between the pod being unready for seconds and for minutes.
  s3:
    # Must include a scheme. A bare host is rejected at startup rather than guessed, because
    # guessing wrong would ship credentials in plaintext.
    endpoint: ""
    bucket: ""
    prefix: ""
    # Most self-hosted gateways ignore the region but require a value. Ceph RGW expects "default"
    # rather than an AWS region name.
    region: default
    # Path-style addressing (host/bucket/key). Required by most self-hosted gateways, whose
    # certificate does not cover per-bucket subdomains.
    pathStyle: true
    # Secret holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Credentials are injected as
    # environment variables, never as flags — flags appear in ps, in the pod spec, and in every
    # kubectl describe.
    existingSecret: ""

  # Registry hosts that may be reached over plain HTTP, comma separated. Matched on host, so naming
  # one internal registry does not downgrade any other request this controller makes.
  insecureRegistry: ""

  # Keeping published images from being reclaimed by the registry.
  #
  # Applies to objects using spec.push. A registry with an expiry policy will delete anything it has
  # not seen used recently; this re-pulls every image a live ImageComposition still references, which
  # is what tells the registry they are still in use. Refreshing only READS -- it needs no write or
  # delete permission and can destroy nothing. See ADR 0031.
  # How many past builds stay pullable per ImageComposition, unless the object overrides it via
  # spec.push.history.
  #
  # Retention is the ONLY thing keeping an older digest resolvable: reverting a commit, and a pod
  # pinned to a previous digest being rescheduled, both depend on it. Layers are shared between
  # builds, so a generous value costs far less than the count suggests.
  keepBuilds: 10

  # SBOM, provenance and signing. All off by default.
  #
  # SIGNING IS INERT UNTIL SOMETHING VERIFIES IT. This chart ships no admission policy, so turning
  # it on changes nothing an attacker experiences until you install Kyverno, policy-controller or
  # Connaisseur and point it at the public key. Example policies: docs/examples/verify.
  #
  # For an ImageComposition the SBOM is DERIVED from the digest-pinned inputs and is exact rather
  # than scanned -- it says "core-1.1.1.tgz sha256:... unpacked at /core", not "openssl 3.0.11".
  # For an ImageBuild it comes from BuildKit and is a scan of the result, because only the build
  # can see what it installed (ADR 0008).
  supplyChain:
    sbom: false
    provenance: false
    signing:
      enabled: false
      # A Secret in the RELEASE namespace, from `cosign generate-key-pair k8s://<ns>/<name>`.
      # Never nameable by an object: the operator signs, tenants do not choose the key.
      existingSecret: ""

  # Refuse any sourceRef that names no revision (threat T1).
  #
  # Pinning is optional by design -- a composition tracking a branch is a legitimate thing to want
  # (ADR 0026) -- so this is how an operator decides otherwise for a whole cluster. Objects that
  # omit `revision:` go Stalled with a message saying so.
  requirePinnedSources: false

  # Refuse `fetch` URLs resolving to private, loopback or CGNAT addresses (threat I6).
  #
  # Cloud metadata endpoints on link-local addresses are refused ALWAYS, whatever this says: they
  # hand out credentials and no layer source lives there. This covers the rest, and is off by
  # default because an artifact server on a private address is an ordinary layer source -- refusing
  # those would make this a guard people turn off. Set it if all your sources are external.
  # See ADR 0036.
  fetchDenyPrivate: false

  retention:
    # Must stay MUCH shorter than the registry's retention window. The RATIO is the guarantee, not
    # either number: the default assumes a window of 30 days, which is a margin of 720. Anyone
    # shortening the window has to shorten this with it.
    #
    # Zero disables refreshing entirely. Correct only when the registry has no expiry policy at
    # all -- and the chart refuses to render it while registry.retention.window is set, because
    # that combination guarantees the deletion ADR 0031 exists to prevent.
    refreshInterval: 1h

# The bundled registry (zot), ON by default.
#
# A registry is now the only way an artifact becomes pullable (ADR 0035), so shipping this enabled
# is what keeps "helm install and you are done" true. Turn it off if you already run one, point
# defaultRegistry.host at yours, and give it defaultRegistry.existingPushSecret.
#
# Deliberately plain: no HA, no object storage, no TLS termination. If you need any of those, run
# zot's own chart or Harbor instead of this.
#
# What you own once this is on: the volume, and backing it up. For ImageComposition that is a
# convenience -- artifacts rebuild from their specs. For ImageBuild the registry is a SYSTEM OF
# RECORD, because a rebuild may not reproduce the digest, so losing this volume loses those images.
# See docs/registry.md.
# Custom resource definitions.
#
# Installed from templates/ rather than crds/, so `helm upgrade` actually applies CRD changes --
# Helm installs crds/ once and never touches it again. Both CRDs are annotated
# helm.sh/resource-policy: keep, so nothing here can delete one: deleting a CRD deletes every object
# of that kind.
#
# Set false when something else owns them (a GitOps CRD sync, or a cluster where CRDs are applied by
# an administrator).
crds:
  install: true

# Which components this release runs. All on by default: one install gives a working, entirely
# local system -- a composer, a builder and a registry for them to publish into.
#
# imageBuild is the one worth a second thought. Its controller creates Jobs, which is the ability to
# run arbitrary containers in this namespace; that is why it used to be a separate chart you opted
# into (ADR 0025). Turning it off here removes its Deployment AND its RBAC, so the capability is
# genuinely gone rather than merely unused.
imageComposition:
  enabled: true

imageBuild:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/lhns/kube-oci-builder
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Both images are part of every build's input hash, so a floating tag would let an upgraded
  # builder change output without changing the hash. The chart refuses to render an unpinned one.
  buildkitImage: "moby/buildkit:v0.17.2-rootless@sha256:5b45405a38c579692f6fcd47ceef2002fe4fa61bb04ef0c2c644cf74cbbd57b8"
  dockerfileFrontend: "docker/dockerfile:1.12.1@sha256:93bfd3b68c109427185cd78b4779fc82b484b0b7618e36d0f104d4d801e66d25"

  # Its own bind addresses: this is a second pod in the same namespace, not the composer.
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"

  sourceDateEpoch: "0"
  keepBuilds: 10
  leaderElect: true
  serviceAccountName: ""

  # SBOM, provenance and signing for builds. See operator.supplyChain for the caveats -- they all
  # apply, and the SBOM here is a scan rather than a derivation.
  #
  # Enabling either attestation CHANGES THE PUBLISHED DIGEST: BuildKit attaches attestations as
  # extra manifests in an index, so a single-platform build's artifact becomes an index. Existing
  # pins keep resolving; anything that assumed the digest named a manifest now finds an index. It
  # is in the input hash, so it happens once, visibly, when you turn it on.
  supplyChain:
    sbom: false
    provenance: false
    signing:
      enabled: false
      existingSecret: ""

  # Refuse an ImageBuild whose spec.context names no revision (threat T1). It matters more here
  # than on the composer: an unpinned context builds whatever the branch is at now, and a build's
  # output cannot be reproduced from its spec (ADR 0025).
  requirePinnedSources: false

  retention:
    refreshInterval: 1h

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# Where objects publish when they do not name a repository themselves.
#
# Empty and registry.enabled -- the default -- means the bundled registry, addressed by its
# in-cluster Service DNS. Set `host` to publish into a registry you already run, and pair it with
# `existingPushSecret`; then set registry.enabled=false and nothing zot-related is installed.
#
# The credential named here is read from the CONTROLLER's namespace, and is used ONLY for objects
# that did not name their own repository. An object naming its own target uses its own secretRef or
# nothing -- the operator's credential is never sent to a registry a tenant chose.
defaultRegistry:
  host: ""
  existingPushSecret: ""
  # Extra hosts reachable over plain HTTP, comma separated.
  #
  # The bundled registry's in-cluster Service name is added automatically -- it is always plain HTTP.
  # `registry.host` is NOT, because it may be an ingress terminating TLS and forcing HTTP would break
  # it. Set this when registry.host is plain HTTP, which a NodePort is:
  #
  #   defaultRegistry.insecure: oci-composer.internal:5000
  insecure: ""

registry:
  enabled: true

  # Pinned by digest, like every other image this project consumes.
  image: ghcr.io/project-zot/zot:v2.1.20@sha256:542e25be4d32e7879c0cfad93492a93c81b1e059cbd2d30d485d4bd567318234

  # Retention. The controllers keep live images alive by re-pulling them; this is the other half of
  # that bargain, and the two have to be set together.
  retention:
    # Which repositories the policy governs. Everything, by default.
    #
    # A repository matching no policy is never collected, which is a useful escape hatch: scope this
    # and anything outside it is kept forever. That is how the e2e compresses the window to seconds
    # without collecting the images its other tests are using.
    repositories: ["**"]

    # How long an image survives without being pulled.
    #
    # MUST stay much longer than operator.retention.refreshInterval. The RATIO is the guarantee, not
    # either number: 720h against 1h is a margin of 720, which means refreshing has to fail
    # continuously for weeks before anything is at risk. Shortening this without shortening the
    # interval turns the guarantee into a race, and the failure mode is deletion.
    window: 720h
    # How often collection runs, and how long something must be eligible before it goes.
    gcInterval: 6h
    gcDelay: 1h
    # Log what would be reclaimed and reclaim nothing. Useful when first tuning the window.
    dryRun: false

  # Anonymous read, authenticated WRITE, enforced by the registry itself with no proxy in front.
  #
  # Reads are open in the cluster because a kubelet pulls without credentials, so anything else
  # breaks image pulls unless every workload carries an imagePullSecret. Unlike what came before
  # this, that IS now a choice: zot can require authentication for reads. Restricting merely who
  # can reach the registry is a NetworkPolicy question, not this registry's.
  #
  # The password is GENERATED at install and reused on upgrade. Nothing to create by hand: the chart
  # writes both halves -- the htpasswd zot authenticates against, and the dockerconfigjson both
  # controllers push with.
  auth:
    enabled: true
    username: composer
    # Pin the password instead of generating one. Needed if you manage Secrets out of band, or if
    # your GitOps tool refuses to leave chart-generated state in the cluster.
    password: ""

    # Supply the htpasswd Secret yourself instead of having the chart generate it. The Secret must
    # hold an `htpasswd` key. Pair it with defaultRegistry.existingPushSecret when you manage both
    # halves of the credential -- the chart refuses to render a configuration where it generates
    # one half and you supply the other, because nothing would agree on the password.
    existingHtpasswdSecret: ""

  # The cluster's DNS domain. Used to address the registry Service internally, and later as a
  # certificate SAN. Change it only if your cluster does not use cluster.local.
  clusterDomain: cluster.local

  # HOW WORKLOADS REACH THE REGISTRY. There is no default, and the chart refuses to install until
  # this is set -- see the long note in templates/_publish.tpl for why.
  #
  # The short version: the CONTROLLERS always use the in-cluster Service and need nothing here.
  # This is entirely about the kubelet, which resolves image references with the NODE's resolver
  # and cannot see cluster DNS. Getting it wrong does not fail at install time on its own; it
  # publishes successfully and then fails every pull with ErrImagePull, days later, somewhere else.
  publish:
    #   ingress       -- an Ingress is rendered; `host` is its hostname
    #   nodePort      -- the Service is a NodePort; `host` is a name your NODES resolve to it,
    #                    which needs a containerd certs.d drop-in per node (docs/registry.md)
    #   external      -- you run the registry; set registry.enabled=false and defaultRegistry.host
    #   internalOnly  -- nothing outside the cluster pulls these images. A deliberate choice, not
    #                    a default: useful when another system copies them onward.
    mode: ""

  # SCALE-OUT CLUSTERING. Read the next paragraph before turning it on.
  #
  # It is NOT replication. zot shards by repository-name hash and proxies each request to the member
  # that owns that repository, so N members means each repository lives on exactly one of them: a
  # member that is down makes roughly 1/N of your repositories unavailable, and zot's own
  # documentation says the cluster is not self-healing. What this buys is throughput and a proxy
  # layer that survives a rolling update. It does not buy availability, which is why the value is
  # called `cluster` and not `ha`.
  #
  # It also has hard prerequisites the chart does not install: S3-compatible object storage and a
  # shared cache driver (redis or dynamodb). BoltDB cannot be shared, so there is no "just add
  # replicas to the PVC" path, and the chart refuses the combinations that look like one.
  #
  # Worth saying plainly: anyone who already runs S3 and redis could equally run a registry of
  # their own and set publish.mode=external. This exists so the bundled registry is not a FORCED
  # single point of failure -- not because this chart is the right way to run a registry estate.
  cluster:
    enabled: false
    replicaCount: 3
    # Exactly 16 characters -- siphash-2-4 takes a 128-bit key. Generated and kept stable if empty.
    # Changing it reshuffles every repository onto a different member; survivable with shared
    # storage, but it is a cluster-wide reshuffle, so stability is the default.
    hashKey: ""

  # Where the registry keeps blobs. `local` is the PVC below; `s3` is required for clustering.
  storage:
    driver: local
    s3:
      bucket: ""
      region: ""
      regionEndpoint: ""
      rootDirectory: /zot
      secure: true
      # Credentials come from the environment (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) via this
      # Secret, never from the config file -- a ConfigMap is visible in every `kubectl describe`.
      existingSecret: ""

  # The metadata cache. `none` is BoltDB on local disk, which cannot be shared between members.
  #
  # WARNING, and it is the one most likely to bite: `extensions.search` records the pull timestamps
  # that the retention policy's `pulledWithin` depends on. In clustered mode that metadata lives
  # HERE rather than in per-pod BoltDB -- so if redis is not persistent, a redis restart loses every
  # pull timestamp, every image looks unpulled, and the next GC pass reclaims images your live
  # objects still reference. That is ADR 0031's failure mode reintroduced by a component this chart
  # does not manage, on a gcDelay fuse rather than a retention window. Use persistent redis.
  cache:
    driver: none
    redis:
      url: ""
      keyprefix: zot
    dynamodb:
      region: ""
      endpoint: ""
      cacheTablename: ""
      repoMetaTablename: ""
      imageMetaTablename: ""
      repoBlobsInfoTablename: ""
      apiKeyTablename: ""
      userDataTablename: ""
      versionTablename: ""

  # TLS on the registry itself.
  #
  # OFF by default, and that is not timidity -- turning it on invalidates the containerd drop-in on
  # every node. zot has one listener, so it cannot serve HTTP and HTTPS at once: each node's
  # hosts.toml has to move from http:// to https:// and, in selfSigned mode, learn the CA. Anyone
  # terminating TLS at an ingress instead is unaffected.
  #
  # What it buys: today the generated push password crosses the pod network in an HTTP Basic
  # header, readable by anything positioned to watch, with no trace in any log -- and that
  # credential is the whole of the "only the controllers can push" guarantee. This closes it.
  tls:
    enabled: false

    #   selfSigned  -- the chart generates a CA and a leaf, and distributes the CA to the
    #                  controllers and to build Jobs. No dependencies. Does NOT renew: the chart
    #                  refuses to render once the certificate is near expiry, and rotation is a
    #                  documented manual sequence.
    #   certManager -- the chart renders a Certificate and cert-manager owns renewal. Recommended
    #                  if you run cert-manager, because renewal is the thing selfSigned cannot do.
    #   secret      -- you supply a kubernetes.io/tls Secret and manage it yourself.
    mode: selfSigned

    # Empty means "<release>-kube-oci-composer-registry-tls". In mode=secret this is the Secret you
    # created; in mode=certManager it is the name cert-manager is told to write.
    secretName: ""

    certManager:
      issuerRef:
        kind: Issuer
        name: ""
        group: cert-manager.io
      duration: 2160h
      # Generous on purpose. zot reads its certificate once at startup, so a renewed Secret is not
      # picked up until the pod restarts -- nothing in the chart can notice, because it does not
      # own the Secret cert-manager rewrites. A long renewBefore leaves room to restart it.
      renewBefore: 360h

    selfSigned:
      caDays: 3650
      certDays: 365
      # Refuse to render when the stored certificate is this close to expiring. An expired
      # certificate here stops the retention refresh, and that reclaims images live objects still
      # reference (ADR 0031) -- so this fails rather than warns.
      failWithinDays: 1

    # Extra SANs beyond the ones computed automatically (the Service names and registry.host).
    dnsNames: []
    ipAddresses: []

    # How the CA reaches the controllers and the build Jobs. Turn it off when the certificate is
    # already publicly trusted -- an ACME issuer, or a corporate CA your images already trust.
    trust:
      enabled: true
      existingConfigMap: ""
      key: ca.crt

  # A NetworkPolicy admitting traffic to the registry.
  #
  # It is a CONNECTIVITY guarantee, not a security control. Reads are anonymous by design and
  # writes need the password, so restricting which namespace may connect adds no authority to
  # either. What it buys is builds that work: a build Job runs in ITS OWN object's namespace and
  # crosses a namespace boundary to push, and in a default-deny cluster nothing lets it through.
  #
  # Two things to know before narrowing it:
  #
  #   * The moment any policy selects the registry pod, that pod goes from "everything allowed" to
  #     "only what is listed". This file therefore has to be complete, not merely correct.
  #   * Image pulls come from the KUBELET, in the node's network namespace. No pod selector can
  #     match them. That is what nodeCIDRs is for -- and on a cluster where pods and nodes sit on
  #     different networks, leaving it empty turns every pull into a timeout that looks exactly
  #     like a broken registry.
  networkPolicy:
    enabled: true
    # Empty means every namespace, which is the default because a build can land anywhere.
    # Listing namespaces asserts you know every one a build will ever run in.
    allowedNamespaces: []
    # CIDRs the kubelets pull from. Needed when node traffic is not already permitted -- check
    # before assuming it is; the symptom of getting this wrong is a pull that hangs.
    nodeCIDRs: []

  # Rendered when publish.mode=ingress. The hostname comes from registry.host, with any port
  # stripped -- an Ingress rule host is a hostname, not a registry reference.
  #
  # TLS terminates HERE, at the ingress, which is where almost everyone's certificate already is.
  # That is what makes this the only mode needing nothing on the nodes: containerd pulls over HTTPS
  # with a certificate it already trusts, so no certs.d drop-in and no CA distribution.
  ingress:
    className: ""
    annotations: {}
    tls:
      enabled: true
      # Leave empty when your ingress controller has a default certificate, or when cert-manager
      # writes one from an annotation above. A name here that nothing creates is worse than none.
      secretName: ""

  # How the registry is reached.
  #
  # The CONTROLLERS always use in-cluster DNS, which needs nothing here.
  service:
    type: ClusterIP
    port: 5000
    nodePort: ""

  # The hostname WORKLOADS pull from, and the only thing status.artifact.ref reports.
  #
  # It is not what the controllers connect to -- they always use the in-cluster Service -- so this
  # name never has to resolve inside the cluster, and setting it can no longer break publishing.
  # Required by every publish.mode except internalOnly.
  host: ""

  persistence:
    # ON by default, unlike most optional components here, and for one reason: an ImageBuild's output
    # cannot be reproduced from its spec, so an emptyDir turns every restart into permanent loss.
    enabled: true
    size: 20Gi
    storageClass: ""

  logLevel: info

  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

# Persistence for the layer cache.
#
# Not a system of record -- it holds fetched layer SOURCES, so anything lost is refetched from
# upstream. An emptyDir is therefore correct and supported; a PVC only buys a faster restart.
# (The images themselves live in the registry, which has its own registry.persistence.)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness means the served store is warm, not merely that the process is up. After a restart the
# pod stays out of the Service until its artifacts have been rebuilt, rather than answering 404 and
# putting workloads into ImagePullBackOff. Rebuilding re-fetches every layer without a warm cache,
# so allow generous time here.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 30

terminationGracePeriodSeconds: 30

podAnnotations: {}
commonLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
