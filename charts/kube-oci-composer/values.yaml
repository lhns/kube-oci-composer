# Default values for kube-oci-composer.

# Raising this does NOT add throughput: reconciling runs under leader election, so extra replicas
# are idle warm standbys.
replicaCount: 1

image:
  repository: ghcr.io/lhns/kube-oci-composer
  # Empty means the chart's appVersion, so the image moves with chart upgrades.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

operator:
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # Keep on: two controllers reconciling one object would push and re-tag concurrently, which the
  # tag-conflict policy reads as a genuine conflict.
  leaderElect: true

  storage:
    # Local directory for fetched layer sources, keyed by digest. Always used, even with S3,
    # because assembly reads local files.
    cacheDir: /var/cache/oci-composer

  # Object storage for the layer cache. Empty endpoint keeps everything local to the pod; with it
  # set, a restart or reschedule reuses cached layers instead of re-fetching all of them.
  s3:
    # Must include a scheme; a bare host is rejected at startup rather than guessed.
    endpoint: ""
    bucket: ""
    prefix: ""
    # Most self-hosted gateways ignore the region but require one; Ceph RGW expects "default".
    region: default
    # Path-style addressing (host/bucket/key), needed by most self-hosted gateways.
    pathStyle: true
    # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, injected as env (never as flags).
    existingSecret: ""

  # Registry hosts reachable over plain HTTP, comma separated. Matched on host, so other requests
  # are not downgraded.
  insecureRegistry: ""

  # How many past builds stay pullable per ImageComposition, unless spec.push.history overrides it.
  # Retention is the ONLY thing keeping an older digest resolvable (reverts, pods pinned to an old
  # digest being rescheduled). Builds share layers, so a generous value is cheap. 0 is clamped to 1.
  keepBuilds: 10

  # SBOM, provenance and signing. All off by default.
  #
  # SIGNING IS INERT UNTIL SOMETHING VERIFIES IT: this chart ships no admission policy. Install
  # Kyverno, policy-controller or Connaisseur with the public key; examples in docs/examples/verify.
  #
  # An ImageComposition's SBOM is derived from its digest-pinned inputs (exact, not scanned); an
  # ImageBuild's comes from BuildKit and is a scan (ADR 0008).
  supplyChain:
    sbom: false
    provenance: false
    signing:
      enabled: false
      # A Secret in the RELEASE namespace, from `cosign generate-key-pair k8s://<ns>/<name>`.
      # Objects cannot name a key; the operator signs.
      existingSecret: ""

  # Refuse any sourceRef without a revision (threat T1). Pinning is optional by design (ADR 0026);
  # this makes it mandatory cluster-wide. Objects omitting `revision:` go Stalled.
  requirePinnedSources: false

  # Refuse `fetch` URLs resolving to private, loopback or CGNAT addresses (threat I6, ADR 0036).
  # Link-local (cloud metadata) is refused ALWAYS. Off by default because an artifact server on a
  # private address is an ordinary source; set it if all your sources are external.
  fetchDenyPrivate: false

  retention:
    # Empty uses the shared interval derived from retention.window; set only to make this
    # controller differ. 0 disables refreshing, which is correct only when the registry never
    # expires anything -- the chart refuses it while retention.window is set (ADR 0031).
    refreshInterval: ""

# Custom resource definitions, installed from templates/ so `helm upgrade` applies CRD changes.
# Both are annotated helm.sh/resource-policy: keep, since deleting a CRD deletes every object of
# its kind. Set false when something else (GitOps, an administrator) owns them.
crds:
  install: true

# How long images are kept. THE setting to think about; the rest derives from it.
#
# With the bundled registry the chart configures this. With your own registry you are DECLARING
# what it already does: the controllers keep live images alive by re-pulling them, and must do so
# faster than your registry expires them. A wrong declaration can lose images.
retention:
  # How long content survives with nothing referencing it. Empty means "my registry never expires
  # anything", which turns off the derivation and the checks.
  window: 720h

  # Everything below is derived from the window. The chart refuses combinations that lose images.

  # refreshInterval = window / refreshFactor. At 720, refreshing must fail continuously for a
  # month before a live image is at risk. The ratio is the guarantee (ADR 0031); below 24 is
  # refused.
  refreshFactor: 720

  # How often the controllers re-pull what live objects reference. Empty derives it. Set it
  # explicitly to go below the derived 30s floor (the e2e uses 1s against a 30s window).
  refreshInterval: ""

# push.writeRefTo: writing a published image reference into a ConfigMap for a consumer, e.g. a Flux
# Kustomization's postBuild.substituteFrom. Applies to both controllers.
#
# Exporting into the object's OWN namespace needs nothing here. The ConfigMap is named
# <kind>-<namespace>-<object name>, e.g. imagebuild-team-a-app.
refExport:
  # Namespaces an object may export into BESIDES its own. Empty permits none. Typically
  # flux-system. Listing one lets EVERY ImageBuild and ImageComposition create a ConfigMap there
  # (under its own non-colliding name). Enforced by the controller, not RBAC (ADR 0056); see
  # ADR 0055 for the cost -- the digest becomes state outside git.
  namespaces: []

  # Labels added to every generated ConfigMap so a watcher notices a new digest. Flux wants
  # "reconcile.fluxcd.io/watch=Enabled" (a label: kustomize-controller selects on it). Empty adds
  # none, and the change is seen only at the consumer's next interval.
  labels: ""

  # Label and annotation keys an object may set on its exported ConfigMap, exact or with a trailing
  # "*". Empty permits none; an unpermitted key is refused, not dropped.
  allowedLabels: []
  allowedAnnotations: []

# Which components run. All on by default: one install gives a composer, a builder and a registry.
#
# imageBuild's controller creates Jobs -- it can run arbitrary containers in this namespace
# (ADR 0025). Disabling it removes its Deployment AND its RBAC.
imageComposition:
  enabled: true

imageBuild:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/lhns/kube-oci-builder
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Must be pinned by digest (refused otherwise): both are part of every build's input hash, so a
  # floating tag could change output without changing the hash.
  buildkitImage: "moby/buildkit:v0.17.2-rootless@sha256:5b45405a38c579692f6fcd47ceef2002fe4fa61bb04ef0c2c644cf74cbbd57b8"
  dockerfileFrontend: "docker/dockerfile:1.12.1@sha256:93bfd3b68c109427185cd78b4779fc82b484b0b7618e36d0f104d4d801e66d25"

  # The init-container image that fetches, verifies and unpacks each build's context. Empty (the
  # usual choice) uses this operator's builder image. Set only to pin it separately; must then be
  # pinned by digest. Its digest is in the build input hash: unpacking bugs can change the tree
  # under an unchanged context digest.
  fetcherImage: ""

  # Refuse a spec.context.fetch URL resolving to a private, loopback or CGNAT address (ADR 0036).
  # Link-local is always refused. Governs the CONTROLLER's read of a Dockerfile from a fetch
  # context; the build pod's own fetch is unguarded, as it already runs arbitrary code.
  fetchDenyPrivate: false

  # This pod's own bind addresses.
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # Where build pods fetch their Flux source, so they never reach source-controller (ADR 0044).
  contextBindAddress: ":8090"

  # Lets build pods (which run in their object's namespace) reach the context endpoint in a
  # default-deny cluster. Empty allowedNamespaces means every namespace; each request still needs
  # a per-build token.
  networkPolicy:
    enabled: true
    allowedNamespaces: []

  sourceDateEpoch: "0"
  keepBuilds: 10
  leaderElect: true
  serviceAccountName: ""

  # SBOM, provenance and signing for builds; the caveats under operator.supplyChain apply.
  #
  # Enabling an attestation CHANGES THE PUBLISHED DIGEST: BuildKit wraps the result in an index.
  # Existing pins keep resolving, but consumers expecting a manifest now get an index. It is in
  # the input hash, so it happens once, when turned on.
  supplyChain:
    sbom: false
    provenance: false
    signing:
      enabled: false
      existingSecret: ""

  # Refuse an ImageBuild whose spec.context has no revision (threat T1). Matters more than for
  # the composer: a build's output cannot be reproduced from its spec (ADR 0025).
  requirePinnedSources: false

  retention:
    # Empty uses the shared interval; see operator.retention.
    refreshInterval: ""

  # How often a running build Job is re-observed. Also bounds how long a build's image sits
  # UNTAGGED before the controller names it (ADR 0054), so registry.retention.gcDelay is never
  # derived below 3x this. The e2e lowers it to compress retention timings.
  buildPollInterval: 15s

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# Where objects publish when they name no repository.
#
# Empty with registry.enabled (the default) means the bundled registry via its in-cluster DNS.
# To use your own registry: set `host` and `existingPushSecret`, and registry.enabled=false.
#
# The credential is read from the CONTROLLER's namespace and used ONLY for objects that named no
# repository; it is never sent to a registry a tenant chose.
defaultRegistry:
  host: ""
  existingPushSecret: ""
  # Extra plain-HTTP hosts, comma separated. The bundled registry's Service name is added
  # automatically; registry.host is NOT (it may be a TLS ingress). Set this when registry.host is
  # plain HTTP, as a NodePort is:
  #
  #   defaultRegistry.insecure: oci-composer.internal:5000
  insecure: ""

# The bundled registry (zot), ON by default: a registry is the only way an artifact becomes
# pullable (ADR 0035). To use your own, set registry.enabled=false plus defaultRegistry.host and
# defaultRegistry.existingPushSecret. For HA writes, object-storage-only setups or TLS termination
# beyond what is here, run zot's own chart or Harbor.
#
# You own the volume and its backups. ImageComposition artifacts rebuild from specs; ImageBuild
# output may not reproduce, so the registry is its SYSTEM OF RECORD. See docs/registry.md.
registry:
  enabled: true

  # Limit for one whole HTTP request, including time queued behind zot's registry-wide upload
  # lock -- not a stall timeout. Short values make large layers unpushable under concurrency.
  # Must be set (zot otherwise applies 60s). docs/registry.md, ADR 0047.
  readTimeout: "1h"

  # Pinned by digest. Do not use a version before v2.1.21: older zot deletes layers published
  # images still need, and pulls then fail partway with a missing layer.
  image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8

  # The registry's collection settings, derived from the top-level retention.window.
  retention:
    # Repositories the policy governs. Narrowing it protects outside repositories only for TAGGED
    # content: zot still collects untagged manifests where no policy matches, including a build's
    # output before it is named.
    repositories: ["**"]

    # Whether untagged manifests are collected. Leave true in production: it reclaims content no
    # tag names any more, including builds refused under onConflict: Fail (ADR 0054). false means
    # nothing untagged is ever reclaimed, and gcDelay is then unconstrained.
    deleteUntagged: true

    # Whether to configure zot's keepUntagged rule (keep untagged manifests while pulled or
    # recently pushed). The controllers publish nothing untagged -- every manifest carries a
    # digest-<hex> tag (ADR 0060) -- so it is off by default.
    #
    # Hazard: with it on, zot keeps every manifest that ever lost its last tag, and its layers,
    # FOREVER (removing the tag deletes the stats it would evaluate). Off, such content goes at the
    # first sweep after its last tag expires, once older than gcDelay.
    #
    # Upgrading from 0.5.x or earlier: set true for the upgrade, wait until every object carries a
    # digest- tag on its artifact AND every history entry (NOTES prints a check on that upgrade),
    # then remove it. Content attached by hand (cosign attest, oras attach) is untagged and is
    # collected by age while this is off.
    keepUntagged: false

    # Upper bound on zot's random per-repository delay before a collection task runs. Empty keeps
    # zot's 30s. A full pass takes roughly repositories x this / 2, which -- more than gcInterval --
    # decides how soon expired content goes. Leave empty in production; exposed for tests (see
    # templates/registry-config.yaml).
    gcMaxSchedulerDelay: ""

    # gcInterval = window / gcFactor. Promptness only: collecting late is safe. Refused if it
    # exceeds the window.
    gcFactor: 120
    gcInterval: ""

    # Minimum age before collection: max(refresh interval, 3x imageBuild.buildPollInterval). The
    # floor covers a build's manifest between its push and the controller naming it (ADR 0054);
    # with keepUntagged off it is the only cover. A builder down for longer can lose an unnamed
    # output (costs a rebuild, not data). Raise it if you prefer.
    gcDelay: ""
    # Report what collection would remove without removing it. Only safe on v2.1.21+; older
    # versions delete blobs even in a dry run.
    dryRun: false

  # Anonymous READ, authenticated WRITE, enforced by zot. Reads are open because kubelets pull
  # without credentials; restricting who can reach the registry is a NetworkPolicy matter.
  #
  # The password is GENERATED at install and reused on upgrade; the chart writes both the htpasswd
  # and the dockerconfigjson the controllers push with.
  auth:
    enabled: true
    username: composer
    # Pin the password instead of generating one (e.g. when a GitOps tool rejects generated state).
    password: ""

    # Supply the htpasswd Secret yourself (key `htpasswd`). Pair with
    # defaultRegistry.existingPushSecret when you manage both halves; supplying only one half is
    # refused, since nothing would agree on the password.
    existingHtpasswdSecret: ""

  # The cluster DNS domain, used for the registry's internal address and certificate SANs.
  clusterDomain: cluster.local

  # HOW WORKLOADS (kubelets) REACH THE REGISTRY. No default: the chart refuses to install until
  # set (see templates/_publish.tpl). The controllers always use the in-cluster Service. The
  # kubelet resolves image references with the NODE's resolver, so a wrong choice publishes fine
  # and then fails every pull with ErrImagePull.
  publish:
    #   ingress       -- an Ingress is rendered; `registry.host` is its hostname
    #   nodePort      -- the Service is a NodePort; `registry.host` is a name your NODES resolve to
    #                    it, plus a containerd certs.d drop-in per node (docs/registry.md)
    #   external      -- you run the registry; set registry.enabled=false and defaultRegistry.host
    #   internalOnly  -- nothing outside the cluster pulls these images, deliberately (e.g. another
    #                    system copies them onward)
    mode: ""

  # READ REPLICAS in addition to the single writer pod. 0 means just the writer.
  #
  # They serve PULLS only: no pushes, no garbage collection (ADR 0041). zot serialises writes with
  # an in-process mutex, so two processes writing one store lose tags (measured 2-4%, test/spike),
  # and collection is a write too.
  #
  # Buys: pulls survive a node drain. Does NOT buy write availability (pushes fail while the writer
  # moves; reconciles retry), write throughput, or removal of the single point of failure -- that
  # moves to the shared store.
  #
  # Requires (refused otherwise): a store every pod sees (storage.driver=s3, or
  # persistence.accessMode=ReadWriteMany) and a shared metadata database (cache.driver).
  readReplicas: 0

  # Resources for each read replica; they hold no write buffers, so less than the writer.
  readerResources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

  # Where the registry keeps blobs. `local` is the PVC below.
  storage:
    driver: local

    # Store a blob once across repositories. Turn OFF if concurrent pushes are slow: dedupe runs
    # inside zot's registry-wide write lock. Costs disk. docs/registry.md, ADR 0047.
    dedupe: true
    s3:
      bucket: ""
      region: ""
      regionEndpoint: ""
      rootDirectory: /zot
      secure: true
      # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, injected as env, never written to
      # the config.
      existingSecret: ""

  # The metadata database. `none` is per-pod BoltDB, which cannot be shared -- readReplicas > 0
  # needs redis or dynamodb.
  #
  # WARNING: this holds the pull timestamps `pulledWithin` retention depends on. If redis is not
  # persistent, a restart makes every image look unpulled and the next GC pass reclaims images live
  # objects still reference (ADR 0031's failure mode, on a gcDelay fuse). Use persistent redis.
  # A redis URL with credentials moves the zot config into a Secret.
  cache:
    driver: none
    redis:
      # Valkey works too (verified against valkey 8).
      url: ""
      keyprefix: zot
    dynamodb:
      region: ""
      endpoint: ""
      cacheTablename: ""
      repoMetaTablename: ""
      imageMetaTablename: ""
      repoBlobsInfoTablename: ""
      apiKeyTablename: ""
      userDataTablename: ""
      versionTablename: ""

  # TLS on the registry itself. Protects the push password, which otherwise crosses the pod network
  # in an HTTP Basic header.
  #
  # OFF by default because enabling it breaks every node's containerd drop-in: zot serves HTTP or
  # HTTPS, not both, so each hosts.toml must move to https:// and (selfSigned) trust the CA.
  # Terminating TLS at an ingress instead is unaffected.
  tls:
    enabled: false

    #   selfSigned  -- the chart generates a CA and leaf and distributes the CA to the controllers
    #                  and build Jobs. Does NOT renew: the chart refuses to render near expiry, and
    #                  rotation is manual.
    #   certManager -- the chart renders a Certificate; cert-manager renews. Recommended if you
    #                  run cert-manager.
    #   secret      -- you supply and manage a kubernetes.io/tls Secret.
    mode: selfSigned

    # Empty means "<release>-kube-oci-composer-registry-tls". mode=secret: the Secret you created;
    # mode=certManager: the name cert-manager writes.
    secretName: ""

    certManager:
      issuerRef:
        kind: Issuer
        name: ""
        group: cert-manager.io
      duration: 2160h
      # Generous on purpose: zot reads its certificate only at startup, so a renewal takes effect
      # after a pod restart, which the chart cannot trigger.
      renewBefore: 360h

    selfSigned:
      caDays: 3650
      certDays: 365
      # Refuse to render when the stored certificate is this close to expiry. An expired cert
      # stops the retention refresh, which deletes live images (ADR 0031).
      failWithinDays: 1

    # Extra SANs beyond the automatic ones (the Service names and registry.host).
    dnsNames: []
    ipAddresses: []

    # Distribute the CA to the controllers and build Jobs. Turn off when the certificate is
    # already trusted (ACME, a corporate CA baked into your images).
    trust:
      enabled: true
      # A ConfigMap you maintain instead, with the CA under the key `ca.crt`.
      existingConfigMap: ""

  # A NetworkPolicy admitting traffic to the registry. A CONNECTIVITY guarantee, not a security
  # control: build Jobs push from their own object's namespace, which default-deny would block.
  #
  # Before narrowing it:
  #   * Once any policy selects the registry pod, only what is listed is allowed.
  #   * Image pulls come from the KUBELET in the node's network, which no pod selector matches.
  #     Where node and pod networks differ, set nodeCIDRs, or pulls time out.
  networkPolicy:
    enabled: true
    # Empty means every namespace (a build can land anywhere). The release namespace is always
    # admitted.
    allowedNamespaces: []
    # CIDRs the kubelets pull from, if node traffic is not already permitted. Symptom of a
    # missing entry: pulls hang.
    nodeCIDRs: []

  # Rendered when publish.mode=ingress, for registry.host with any port stripped. TLS terminates
  # here, so nodes need no drop-in and no CA distribution.
  ingress:
    className: ""
    annotations: {}
    tls:
      enabled: true
      # Leave empty when the ingress controller has a default certificate or cert-manager writes
      # one from an annotation. Do not name a Secret nothing creates.
      secretName: ""

  # The Service workloads pull through (the read Service). The controllers always use in-cluster
  # DNS.
  service:
    type: ClusterIP
    port: 5000
    nodePort: ""

  # The hostname WORKLOADS pull from, and what status.artifact.ref reports. The controllers never
  # connect to it, so it need not resolve inside the cluster. Required by every publish.mode except
  # internalOnly.
  host: ""

  persistence:
    # ON by default: an ImageBuild's output cannot be reproduced, so an emptyDir loses it on every
    # restart.
    enabled: true
    size: 20Gi
    storageClass: ""
    # ReadWriteMany lets read replicas share the store; required for readReplicas > 0 unless
    # storage.driver is s3. The chart can only check what you ASKED for: a provisioner may bind
    # RWX per-node and have pods serve different content. Confirm with `kubectl get pvc`.
    #
    # Immutable on an existing claim; see docs/registry.md for the migration.
    accessMode: ReadWriteOnce

  logLevel: info

  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

  # Placement for the REGISTRY pods, separate from the top-level keys that place the controllers,
  # so e.g. the registry can be kept on storage nodes and off nodes you are about to drain.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  # Worth setting above your workloads: it does not stop evictions, but decides who gets a node
  # back first when capacity is tight, as during a cordon.
  priorityClassName: ""

  # How long zot gets to finish in-flight requests on shutdown.
  terminationGracePeriodSeconds: 30

  podDisruptionBudget:
    # Rendered only with read replicas: a 1-of-1 budget can never be satisfied and would block
    # every drain.
    enabled: true
    minAvailable: 1

# Persistence for the composer's layer cache. Not a system of record (layers are refetched), so
# emptyDir is fine; a PVC only buys a faster restart. Images live in the registry
# (registry.persistence).
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness means the served store is warm, so a restarted pod stays out of the Service until its
# artifacts are rebuilt. Without a warm layer cache that re-fetches every layer; allow time.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 30

terminationGracePeriodSeconds: 30

podAnnotations: {}
commonLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
