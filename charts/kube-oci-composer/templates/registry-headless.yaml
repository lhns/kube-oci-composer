{{- if .Values.registry.enabled }}
{{- /* The headless Service the StatefulSet names as its `serviceName`. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
  ports:
    - name: registry
      port: {{ .Values.registry.service.port }}
      targetPort: registry
{{- end }}
