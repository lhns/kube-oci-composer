{{- if .Values.imageComposition.enabled }}
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-oci-composer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* Both controllers; the component filter keeps the registry's Services out. */}}
  selector:
    matchLabels:
      {{- include "kube-oci-composer.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [composer, builder]
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
