{{- if .Values.registry.enabled }}
{{- /*
The WRITE Service: always ClusterIP, selecting only the single writer. Every push goes here, which
is what keeps the read replicas safe (ADR 0041). Workloads pull through registry-read instead.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  selector:
    {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
  type: ClusterIP
  ports:
    - name: registry
      port: {{ .Values.registry.service.port }}
      targetPort: registry
---
{{- /*
The writer. A StatefulSet so a rolling update stops pod-0 before starting its replacement (no
ReadWriteOnce deadlock). Deliberately NOT volumeClaimTemplates: that would create a new
`data-<sts>-0` claim and orphan the existing PVC, which for ImageBuild is the only copy (ADR 0025).
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  serviceName: {{ include "kube-oci-composer.registryFullname" . }}-headless
  {{- /* Always one: a second writer silently drops tags (ADR 0041). Reads scale via readReplicas. */}}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry") | nindent 6 }}
  template:
    metadata:
      annotations:
        # A config change has to restart the pod; zot reads its config once at startup.
        checksum/config: {{ include (print $.Template.BasePath "/registry-config.yaml") . | sha256sum }}
      labels:
        {{- /* The serve-role label is on the pod template only; the selector above is immutable. */}}
        {{- include "kube-oci-composer.registryPodLabels" (dict "ctx" . "component" "registry") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.registry.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Registry-scoped placement, separate from the controllers' top-level values. */}}
      {{- with .Values.registry.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.registry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- include "kube-oci-composer.registryContainer" (dict "ctx" . "resources" .Values.registry.resources) | nindent 8 }}
      volumes:
        {{- include "kube-oci-composer.registryVolumes" (dict "ctx" . "config" (include "kube-oci-composer.registryFullname" .)) | nindent 8 }}
{{- if .Values.registry.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
  annotations:
    # Survives `helm uninstall`: for ImageBuild these bytes are the only copy.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.registry.persistence.accessMode }}]
  {{- with .Values.registry.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.persistence.size | quote }}
{{- end }}
{{- end }}
