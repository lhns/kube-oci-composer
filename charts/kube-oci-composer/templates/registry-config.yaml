{{- if .Values.registry.enabled }}
{{- /*
An optional bundled registry, off by default.

ADR 0030 makes a real registry the serving surface for both kinds, which would otherwise turn "helm
install and you are done" into "helm install, then go and run a registry". Bundling one keeps
installation a single command for anyone who has not already got one.

WHAT THE OPERATOR OWNS once this is on: the volume, and backing it up. For ImageComposition that is a
convenience, since every artifact is rebuildable from its spec. For ImageBuild the registry is a
SYSTEM OF RECORD -- a rebuild may not reproduce the digest (ADR 0025) -- so losing this volume loses
those images. See docs/registry.md.

TWO CONFIGURATIONS, and the difference between them is the whole of ADR 0041.

zot serialises repository writes with an IN-PROCESS mutex: a push is a read-modify-write of
<repo>/index.json, and nothing coordinates two processes doing it at once. Measured, three instances
over one store lost 2-4% of tags that had returned 201 (test/spike). Garbage collection is a writer
too -- it rewrites index.json to drop untagged manifests -- so an instance that only serves pulls is
still a mutator if it collects.

So exactly one instance may mutate: it takes every push, and it is the only one with `gc` and a
retention policy. Read replicas get the same store and the same metadata database with `gc` off and
no policy, and they only ever serve.
*/}}
{{- $roles := list (dict "name" (include "kube-oci-composer.registryFullname" .) "component" "registry" "mutator" true) }}
{{- if gt (int .Values.registry.readReplicas) 0 }}
{{- $roles = append $roles (dict "name" (printf "%s-reader" (include "kube-oci-composer.registryFullname" .)) "component" "registry-reader" "mutator" false) }}
{{- end }}
{{- range $i, $role := $roles }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
{{- if include "kube-oci-composer.registryConfigIsSecret" $ }}
kind: Secret
type: Opaque
{{- else }}
kind: ConfigMap
{{- end }}
metadata:
  name: {{ $role.name }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" $ "component" $role.component) | nindent 4 }}
{{- if include "kube-oci-composer.registryConfigIsSecret" $ }}
stringData:
{{- else }}
data:
{{- end }}
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": {{ ternary $.Values.registry.storage.s3.rootDirectory "/var/lib/registry" (eq $.Values.registry.storage.driver "s3") | quote }},
        {{- /* Runs inside zot's registry-wide write lock; the knob for slow concurrent pushes (ADR 0047). */}}
        "dedupe": {{ $.Values.registry.storage.dedupe }},
        {{- if eq $.Values.registry.storage.driver "s3" }}
        {{- /*
        No accesskey/secretkey here. The driver honours the standard AWS environment chain, and the
        credentials are injected as env from a Secret -- a ConfigMap is visible in every
        `kubectl describe`, which is the same rule TestChartCredentialsAreNotFlags enforces for the
        composer's own S3.
        */}}
        "storageDriver": {
          "name": "s3",
          "rootdirectory": {{ $.Values.registry.storage.s3.rootDirectory | quote }},
          "region": {{ $.Values.registry.storage.s3.region | quote }},
          "bucket": {{ $.Values.registry.storage.s3.bucket | quote }},
          {{- with $.Values.registry.storage.s3.regionEndpoint }}
          "regionendpoint": {{ . | quote }},
          {{- end }}
          "secure": {{ $.Values.registry.storage.s3.secure }}
        },
        {{- end }}
        {{- if ne $.Values.registry.cache.driver "none" }}
        "remoteCache": true,
        "cacheDriver": {
          {{- if eq $.Values.registry.cache.driver "redis" }}
          "name": "redis",
          "url": {{ $.Values.registry.cache.redis.url | quote }},
          "keyprefix": {{ $.Values.registry.cache.redis.keyprefix | quote }}
          {{- else }}
          "name": "dynamodb",
          "region": {{ $.Values.registry.cache.dynamodb.region | quote }},
          {{- with $.Values.registry.cache.dynamodb.endpoint }}
          "endpoint": {{ . | quote }},
          {{- end }}
          "cacheTablename": {{ $.Values.registry.cache.dynamodb.cacheTablename | quote }},
          "repoMetaTablename": {{ $.Values.registry.cache.dynamodb.repoMetaTablename | quote }},
          "imageMetaTablename": {{ $.Values.registry.cache.dynamodb.imageMetaTablename | quote }},
          "repoBlobsInfoTablename": {{ $.Values.registry.cache.dynamodb.repoBlobsInfoTablename | quote }},
          "apiKeyTablename": {{ $.Values.registry.cache.dynamodb.apiKeyTablename | quote }},
          "userDataTablename": {{ $.Values.registry.cache.dynamodb.userDataTablename | quote }},
          "versionTablename": {{ $.Values.registry.cache.dynamodb.versionTablename | quote }}
          {{- end }}
        },
        {{- end }}
        {{- if $role.mutator }}
        "gc": true,
        "gcDelay": {{ $.Values.registry.retention.gcDelay | quote }},
        "gcInterval": {{ $.Values.registry.retention.gcInterval | quote }},
        "retention": {
          "dryRun": {{ $.Values.registry.retention.dryRun }},
          "policies": [
            {
              "repositories": {{ toJson $.Values.registry.retention.repositories }},
              "deleteUntagged": true,
              "keepTags": [
                { "patterns": [".*"], "pulledWithin": {{ $.Values.registry.retention.window | quote }} }
              ],
              "keepUntagged": { "pulledWithin": {{ $.Values.registry.retention.window | quote }} }
            }
          ]
        }
        {{- else }}
        {{- /*
        A read replica collects nothing. Collection rewrites index.json, which would make this a
        second mutator and reintroduce exactly the loss ADR 0041 measured -- content reclaimed while
        it was being actively refreshed.
        */}}
        "gc": false
        {{- end }}
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        {{- /*
        Emitted ALWAYS: absent, zot's CLI injects 60s, and Go's ReadTimeout bounds the whole request
        including time queued behind the registry-wide upload lock, so large layers stop being
        pushable at all. ADR 0047.
        */}}
        "readTimeout": {{ $.Values.registry.readTimeout | quote }}
        {{- if $.Values.registry.tls.enabled }},
        {{- /*
        http.tls, NOT http.tls.cacert.

        One word apart and opposite meanings. This is the server's own certificate. `cacert` in the
        same block is zot's CLIENT CA -- setting it demands a client certificate from every caller,
        including the kubelet, which has none, and every pull in the cluster stops.
        */}}
        "tls": { "cert": "/etc/zot/tls/tls.crt", "key": "/etc/zot/tls/tls.key" }
        {{- end }}
        {{- if $.Values.registry.auth.enabled }},
        "auth": { "htpasswd": { "path": "/etc/zot/auth/htpasswd" } },
        {{- /*
          Anonymous READ, authenticated WRITE, enforced by the registry itself with no proxy in
          front. Reads are open in the cluster exactly as the embedded serving endpoint's were --
          a kubelet pulls without credentials, so anything else breaks image pulls.

          Kept on read replicas too. They are not supposed to receive writes -- no Service routes
          any to them -- but a replica that would ACCEPT an anonymous push if something reached it
          directly is a replica one port-forward away from being a second mutator.
        */}}
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "policies": [
                {
                  "users": [{{ $.Values.registry.auth.username | quote }}],
                  "actions": ["read", "create", "update"]
                }
              ]
            }
          }
        }
        {{- end }}
      },
      {{- /*
        NOT optional, and the single easiest thing to remove while believing it is decoration.
        Pull-recency retention needs the registry to have RECORDED a pull, and that metadata lives
        here. Without it `pulledWithin` matches nothing and every tag expires however often it is
        fetched -- silently, and in the direction that deletes.

        On a read replica it is what makes a workload's pull count: the timestamp goes to the shared
        metadata database, where the mutator's collector reads it.
      */}}
      "extensions": { "search": { "enable": true } },
      "log": { "level": {{ $.Values.registry.logLevel | quote }} }
    }
{{- end }}
{{- end }}
