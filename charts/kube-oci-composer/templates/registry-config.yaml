{{- if .Values.registry.enabled }}
{{- /*
zot's configuration, one per role (ADR 0041). zot serialises repository writes with an in-process
mutex, so two processes writing one store lose tags (measured 2-4%, test/spike), and GC is a write
too. So exactly one instance mutates -- it takes every push and alone has `gc` and the retention
policy -- and read replicas get the same store and metadata database with `gc` off.
*/}}
{{- $roles := list (dict "name" (include "kube-oci-composer.registryFullname" .) "component" "registry" "mutator" true) }}
{{- if gt (int .Values.registry.readReplicas) 0 }}
{{- $roles = append $roles (dict "name" (printf "%s-reader" (include "kube-oci-composer.registryFullname" .)) "component" "registry-reader" "mutator" false) }}
{{- end }}
{{- range $i, $role := $roles }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
{{- if include "kube-oci-composer.registryConfigIsSecret" $ }}
kind: Secret
type: Opaque
{{- else }}
kind: ConfigMap
{{- end }}
metadata:
  name: {{ $role.name }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" $ "component" $role.component) | nindent 4 }}
{{- if include "kube-oci-composer.registryConfigIsSecret" $ }}
stringData:
{{- else }}
data:
{{- end }}
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": {{ ternary $.Values.registry.storage.s3.rootDirectory "/var/lib/registry" (eq $.Values.registry.storage.driver "s3") | quote }},
        {{- /* Runs inside zot's registry-wide write lock; the knob for slow concurrent pushes (ADR 0047). */}}
        "dedupe": {{ $.Values.registry.storage.dedupe }},
        {{- if eq $.Values.registry.storage.driver "s3" }}
        {{- /* No keys here: credentials come from the AWS env chain via a Secret, never a ConfigMap. */}}
        "storageDriver": {
          "name": "s3",
          "rootdirectory": {{ $.Values.registry.storage.s3.rootDirectory | quote }},
          "region": {{ $.Values.registry.storage.s3.region | quote }},
          "bucket": {{ $.Values.registry.storage.s3.bucket | quote }},
          {{- with $.Values.registry.storage.s3.regionEndpoint }}
          "regionendpoint": {{ . | quote }},
          {{- end }}
          "secure": {{ $.Values.registry.storage.s3.secure }}
        },
        {{- end }}
        {{- if ne $.Values.registry.cache.driver "none" }}
        "remoteCache": true,
        "cacheDriver": {
          {{- if eq $.Values.registry.cache.driver "redis" }}
          "name": "redis",
          "url": {{ $.Values.registry.cache.redis.url | quote }},
          "keyprefix": {{ $.Values.registry.cache.redis.keyprefix | quote }}
          {{- else }}
          "name": "dynamodb",
          "region": {{ $.Values.registry.cache.dynamodb.region | quote }},
          {{- with $.Values.registry.cache.dynamodb.endpoint }}
          "endpoint": {{ . | quote }},
          {{- end }}
          "cacheTablename": {{ $.Values.registry.cache.dynamodb.cacheTablename | quote }},
          "repoMetaTablename": {{ $.Values.registry.cache.dynamodb.repoMetaTablename | quote }},
          "imageMetaTablename": {{ $.Values.registry.cache.dynamodb.imageMetaTablename | quote }},
          "repoBlobsInfoTablename": {{ $.Values.registry.cache.dynamodb.repoBlobsInfoTablename | quote }},
          "apiKeyTablename": {{ $.Values.registry.cache.dynamodb.apiKeyTablename | quote }},
          "userDataTablename": {{ $.Values.registry.cache.dynamodb.userDataTablename | quote }},
          "versionTablename": {{ $.Values.registry.cache.dynamodb.versionTablename | quote }}
          {{- end }}
        },
        {{- end }}
        {{- if $role.mutator }}
        "gc": true,
        "gcDelay": {{ include "kube-oci-composer.gcDelay" $ | quote }},
        "gcInterval": {{ include "kube-oci-composer.gcInterval" $ | quote }},
        {{- with $.Values.registry.retention.gcMaxSchedulerDelay }}
        {{- /*
        Test-only. zot marks this field not user-configurable; it is reachable only because
        viper/mapstructure ignores the yaml tag hiding it. If an upgrade removes it, the default
        30s applies again.
        */}}
        "gcMaxSchedulerDelay": {{ . | quote }},
        {{- end }}
        "retention": {
          "dryRun": {{ $.Values.registry.retention.dryRun }},
          "policies": [
            {
              "repositories": {{ toJson $.Values.registry.retention.repositories }},
              "deleteUntagged": {{ $.Values.registry.retention.deleteUntagged }},
              {{- /*
              ONE keepTags entry carrying both rules. zot's getTagPolicy returns the FIRST entry
              whose patterns match, so a second ".*" entry is never reached; rules within an entry
              are OR-ed. Verified against zot v2.1.21, ADR 0057. pushedWithin only helps brand-new
              content: zot records a digest's push time once and never renews it.
              */}}
              "keepTags": [
                {
                  "patterns": [".*"],
                  "pulledWithin": {{ $.Values.retention.window | quote }},
                  "pushedWithin": {{ $.Values.retention.window | quote }}
                }
              ]
              {{- if $.Values.registry.retention.keepUntagged }},
              {{- /*
              Only when asked for: configured at all, zot keeps every formerly tagged manifest (and
              its layers) forever. See values.yaml and ADR 0060. Push recency is included so fresh
              untagged content matches something.
              */}}
              "keepUntagged": {
                "pulledWithin": {{ $.Values.retention.window | quote }},
                "pushedWithin": {{ $.Values.retention.window | quote }}
              }
              {{- end }}
            }
          ]
        }
        {{- else }}
        {{- /* A read replica must not collect: that would make it a second mutator (ADR 0041). */}}
        "gc": false
        {{- end }}
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        {{- /*
        Always emitted: absent, zot injects 60s for the WHOLE request, including time queued behind
        the upload lock, and large layers become unpushable. ADR 0047.
        */}}
        "readTimeout": {{ $.Values.registry.readTimeout | quote }}
        {{- if $.Values.registry.tls.enabled }},
        {{- /*
        http.tls is the server certificate. Do NOT set http.tls.cacert: that is zot's CLIENT CA and
        demands a client certificate from every caller, including the kubelet.
        */}}
        "tls": { "cert": "/etc/zot/tls/tls.crt", "key": "/etc/zot/tls/tls.key" }
        {{- end }}
        {{- if $.Values.registry.auth.enabled }},
        "auth": { "htpasswd": { "path": "/etc/zot/auth/htpasswd" } },
        {{- /*
          Anonymous read (a kubelet pulls without credentials), authenticated write. Kept on read
          replicas too, so one reached directly still refuses anonymous pushes.
        */}}
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "policies": [
                {
                  "users": [{{ $.Values.registry.auth.username | quote }}],
                  "actions": ["read", "create", "update"]
                }
              ]
            }
          }
        }
        {{- end }}
      },
      {{- /*
        Required, not decoration: the search extension records pulls, and without it `pulledWithin`
        matches nothing and every tag expires however often it is pulled. On a read replica it
        writes the pull to the shared metadata database, where the writer's collector sees it.
      */}}
      "extensions": { "search": { "enable": true } },
      "log": { "level": {{ $.Values.registry.logLevel | quote }} }
    }
{{- end }}
{{- end }}
