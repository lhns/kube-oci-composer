{{- if .Values.crds.install }}
{{- /*
CRDs are in templates/, not crds/, because Helm never upgrades crds/. Emitted verbatim; the
helm.sh/resource-policy: keep annotation comes from a kubebuilder marker. Both are installed
regardless of the component toggles: deleting a CRD deletes every object of its kind.
*/}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
---
{{ $.Files.Get $path }}
{{- end }}
{{- end }}
