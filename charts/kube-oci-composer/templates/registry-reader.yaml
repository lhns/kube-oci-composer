{{- if .Values.registry.enabled }}
{{- /*
The READ Service: what workloads pull from and what an Ingress or NodePort exposes. It selects every
pod serving the API (writer plus read replicas), and exists even at readReplicas: 0 so there is one
code path. Replicas only read and never collect (ADR 0041).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-read
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  selector:
    {{- include "kube-oci-composer.registryServeSelectorLabels" . | nindent 4 }}
  type: {{ .Values.registry.service.type }}
  ports:
    - name: registry
      port: {{ .Values.registry.service.port }}
      targetPort: registry
      {{- if and (eq .Values.registry.service.type "NodePort") .Values.registry.service.nodePort }}
      # Reachable by the kubelet via a containerd certs.d drop-in; see docs/registry.md.
      nodePort: {{ .Values.registry.service.nodePort }}
      {{- end }}
{{- if gt (int .Values.registry.readReplicas) 0 }}
---
{{- /*
A Deployment: a read replica holds no state of its own (shared store, shared metadata database).
It mounts the writer's claim, hence ReadWriteMany unless the store is S3.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-reader
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry-reader") | nindent 4 }}
spec:
  replicas: {{ .Values.registry.readReplicas }}
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry-reader") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/registry-config.yaml") . | sha256sum }}
      labels:
        {{- include "kube-oci-composer.registryPodLabels" (dict "ctx" . "component" "registry-reader") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.registry.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.registry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.registry.affinity }}
      affinity:
        {{- toYaml .Values.registry.affinity | nindent 8 }}
      {{- else }}
      {{- /*
      Spread across nodes, or N replicas survive exactly what one does. Preferred, not required:
      required with more replicas than nodes leaves pods Pending forever. NOTES warns about
      co-location.
      */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "kube-oci-composer.registryServeSelectorLabels" . | nindent 20 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- include "kube-oci-composer.registryContainer" (dict "ctx" . "resources" .Values.registry.readerResources) | nindent 8 }}
      volumes:
        {{- /* The reader configuration: gc off, no retention policy. */}}
        {{- include "kube-oci-composer.registryVolumes" (dict "ctx" . "config" (printf "%s-reader" (include "kube-oci-composer.registryFullname" .))) | nindent 8 }}
{{- end }}
{{- end }}
