{{- if .Values.imageComposition.enabled }}
{{- if and .Values.operator.s3.presignBlobs (not .Values.operator.s3.endpoint) }}
{{- fail "operator.s3.presignBlobs requires operator.s3.endpoint" }}
{{- end }}
{{- if and .Values.operator.s3.endpoint (not .Values.operator.s3.bucket) }}
{{- fail "operator.s3.endpoint requires operator.s3.bucket" }}
{{- end }}
{{- /*
The shared-storage guards are gone with the serving endpoint. They existed because a second replica
without shared blobs would join the Service and 404 every pull that reached it -- there is no Service
and no blob store now, and what remains is a layer CACHE, which is per-pod by design and costs a
refetch rather than a failed pull. Multiple replicas are ordinary; only publishing and status writes
are leader-scoped.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oci-composer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "composer") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate. With a node-local blob store on a ReadWriteOnce volume, two pods
  # cannot mount it at once; and a rolling update would briefly have a new pod that is not the
  # leader, serving nothing, while the old one is being torn down.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "composer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "composer") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-oci-composer.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address={{ .Values.operator.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.operator.healthProbeBindAddress }}
            - --cache-dir={{ .Values.operator.storage.cacheDir }}
            {{- with .Values.operator.s3.endpoint }}
            - --s3-endpoint={{ . }}
            - --s3-bucket={{ $.Values.operator.s3.bucket }}
            {{- with $.Values.operator.s3.prefix }}
            - --s3-prefix={{ . }}
            {{- end }}
            - --s3-region={{ $.Values.operator.s3.region }}
            - --s3-path-style={{ $.Values.operator.s3.pathStyle }}
            {{- if $.Values.operator.s3.presignBlobs }}
            - --s3-presign-blobs
            {{- end }}
            {{- end }}
            - --keep-builds={{ .Values.operator.keepBuilds }}
            - --retention-refresh-interval={{ .Values.operator.retention.refreshInterval }}
            {{- if .Values.operator.requirePinnedSources }}
            - --require-pinned-sources
            {{- end }}
            {{- if .Values.operator.fetchDenyPrivate }}
            - --fetch-deny-private
            {{- end }}
            {{- with (include "kube-oci-composer.defaultRegistry" .) }}
            - --default-registry={{ . }}
            {{- end }}
            {{- with (include "kube-oci-composer.pushSecretName" .) }}
            - --default-push-secret={{ . }}
            {{- end }}
            {{- with (include "kube-oci-composer.insecureRegistries" .) }}
            - --insecure-registry={{ . }}
            {{- end }}
          {{- if .Values.operator.s3.existingSecret }}
          env:
            # Credentials as environment variables, never as flags: flags are visible in ps, in the
            # pod spec, and in every kubectl describe.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          {{- end }}
          env:
            # The default push credential is read from the CONTROLLER's namespace, not the
            # object's: it belongs to the operator, not to a tenant. See ADR H.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ include "kube-oci-composer.port" .Values.operator.metricsBindAddress }}
              protocol: TCP
            - name: probes
              containerPort: {{ include "kube-oci-composer.port" .Values.operator.healthProbeBindAddress }}
              protocol: TCP
          livenessProbe:
            # A bare ping. A standby replica is alive and must not be restarted merely for not
            # being the leader.
            httpGet:
              path: /healthz
              port: probes
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            # Reports whether the served store is warm, so the pod joins the Service only once it
            # has something to serve.
            httpGet:
              path: /readyz
              port: probes
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.operator.storage.cacheDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        # The layer CACHE, and only that. It used to sit beside a blob store holding served
        # artifacts; that store is gone, and what is left is a cache -- losing it costs a refetch,
        # not a failed pull, which is why emptyDir is a reasonable default and a PVC only buys a
        # faster restart.
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kube-oci-composer.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Assembly writes layer tarballs to a temp directory, so /tmp must be writable even though
        # the root filesystem is not.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
