{{- if .Values.imageComposition.enabled }}
{{- if and .Values.operator.s3.endpoint (not .Values.operator.s3.bucket) }}
{{- fail "operator.s3.endpoint requires operator.s3.bucket" }}
{{- end }}
{{- /*
Extra replicas are ordinary here: only reconciling is leader-scoped, and the volume below is a
per-pod layer CACHE, where a cold start costs a refetch rather than a failed pull.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oci-composer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "composer") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate: a rolling update would deadlock on the ReadWriteOnce cache volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "composer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "composer") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-oci-composer.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address={{ .Values.operator.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.operator.healthProbeBindAddress }}
            - --cache-dir={{ .Values.operator.storage.cacheDir }}
            {{- with .Values.operator.s3.endpoint }}
            - --s3-endpoint={{ . }}
            - --s3-bucket={{ $.Values.operator.s3.bucket }}
            {{- with $.Values.operator.s3.prefix }}
            - --s3-prefix={{ . }}
            {{- end }}
            - --s3-region={{ $.Values.operator.s3.region }}
            - --s3-path-style={{ $.Values.operator.s3.pathStyle }}
            {{- end }}
            - --keep-builds={{ .Values.operator.keepBuilds }}
            - --retention-refresh-interval={{ include "kube-oci-composer.composerRefreshInterval" . }}
            {{- with include "kube-oci-composer.refExportArgs" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.operator.requirePinnedSources }}
            - --require-pinned-sources
            {{- end }}
            {{- if .Values.operator.fetchDenyPrivate }}
            - --fetch-deny-private
            {{- end }}
            {{- include "kube-oci-composer.registryArgs" (dict "ctx" $ "supplyChain" .Values.operator.supplyChain) | trim | nindent 12 }}
          env:
            # The default push credential is read from the CONTROLLER's namespace: it belongs to
            # the operator, not to a tenant.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.operator.s3.existingSecret }}
            # Credentials as env, never flags (visible in ps and kubectl describe). In the same
            # list: a second env: key replaced this one and dropped them.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ include "kube-oci-composer.port" .Values.operator.metricsBindAddress }}
              protocol: TCP
            - name: probes
              containerPort: {{ include "kube-oci-composer.port" .Values.operator.healthProbeBindAddress }}
              protocol: TCP
          livenessProbe:
            # A bare ping: a non-leader standby is alive.
            httpGet:
              path: /healthz
              port: probes
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            # Ready once the served store is warm.
            httpGet:
              path: /readyz
              port: probes
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.operator.storage.cacheDir }}
            - name: tmp
              mountPath: /tmp
            {{- include "kube-oci-composer.registryCAVolumeMount" $ | nindent 12 }}
      volumes:
        {{- include "kube-oci-composer.registryCAVolume" $ | nindent 8 }}

        # The layer cache: losing it costs a refetch, so emptyDir is fine and a PVC only speeds
        # up restarts.
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kube-oci-composer.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Assembly writes temp tarballs; the root filesystem is read-only.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
