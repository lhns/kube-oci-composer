{{- /*
Two Secrets from one generated password, on INDEPENDENT conditions: htpasswd follows
registry.auth.enabled because the registry mounts it on that alone. A supplied push Secret with a
generated password is refused by checkRegistryAuth.
*/}}
{{- $password := include "kube-oci-composer.registryPassword" . }}
{{- $user := .Values.registry.auth.username }}
{{- $host := include "kube-oci-composer.defaultRegistry" . }}
{{- if and .Values.registry.enabled (not .Values.defaultRegistry.existingPushSecret) }}
{{- /* The dockerconfigjson both controllers push with. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-push
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # Read back by registryPassword on upgrade, so the password survives it.
  password: {{ $password | quote }}
  .dockerconfigjson: {{ printf `{"auths":{%q:{"username":%q,"password":%q,"auth":%q}}}` $host $user $password (printf "%s:%s" $user $password | b64enc) | quote }}
{{- end }}
{{- if and .Values.registry.enabled .Values.registry.auth.enabled (not .Values.registry.auth.existingHtpasswdSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-htpasswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
type: Opaque
stringData:
  # bcrypt. Read once at startup and not in the config checksum: a password change needs a restart.
  htpasswd: {{ htpasswd $user $password | quote }}
{{- end }}
