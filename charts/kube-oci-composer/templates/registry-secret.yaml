{{- /*
Two Secrets from one generated password, on two INDEPENDENT conditions -- and the independence is
the whole point of this file's shape.

They were gated together once, both on `not defaultRegistry.existingPushSecret`. But the registry
Deployment mounts the htpasswd Secret on `registry.auth.enabled` alone, so bringing your own push
credential while leaving the bundled registry authenticated skipped a Secret that was still
mounted, and the registry pod wedged waiting for it. Rendered cleanly; failed only in a cluster.

The obvious repair -- gate htpasswd on `auth.enabled` alone -- is worse, and it is worth writing
down because it looks right. `registryPassword` reads the previous password back out of the `-push`
Secret. With no `-push` Secret there is nothing to read, so every `helm upgrade` mints a fresh
`randAlphaNum 32`, and the registry ends up demanding a password nobody has -- including the
credential you supplied. Coherent, renders forever, permanently broken.

So that combination is REFUSED at render time (`checkRegistryAuth`, _registry.tpl) rather than
papered over, and `registry.auth.existingHtpasswdSecret` exists for anyone managing both halves
out of band.
*/}}
{{- $password := include "kube-oci-composer.registryPassword" . }}
{{- $user := .Values.registry.auth.username }}
{{- $host := include "kube-oci-composer.defaultRegistry" . }}
{{- if and .Values.registry.enabled (not .Values.defaultRegistry.existingPushSecret) }}
{{- /*
The dockerconfigjson both controllers push with.

Generated rather than asked for, because a registry that ships enabled has to ship usable, and an
install that stops to demand a password is not "one command". Supply `registry.auth.password` to
pin it, or `defaultRegistry.existingPushSecret` to bring your own credential entirely.

The password is stored under its own `password` key as well as inside `.dockerconfigjson`. That is
not duplication for convenience -- it is what `registryPassword` reads back on upgrade, and without
it every `helm upgrade` would mint a new password and lock the controllers out of everything they
have already published.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-push
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # Read back by kube-oci-composer.registryPassword on upgrade. See above.
  password: {{ $password | quote }}
  .dockerconfigjson: {{ printf `{"auths":{%q:{"username":%q,"password":%q,"auth":%q}}}` $host $user $password (printf "%s:%s" $user $password | b64enc) | quote }}
{{- end }}
{{- if and .Values.registry.enabled .Values.registry.auth.enabled (not .Values.registry.auth.existingHtpasswdSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}-htpasswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
type: Opaque
stringData:
  # bcrypt, via sprig. zot reads this file once at startup; the Deployment's config checksum
  # annotation does not cover it, so a password change needs the pod to restart.
  htpasswd: {{ htpasswd $user $password | quote }}
{{- end }}
