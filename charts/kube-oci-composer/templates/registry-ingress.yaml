{{- if and .Values.registry.enabled (eq .Values.registry.publish.mode "ingress") }}
{{- /*
The only publish mode needing nothing on the nodes: containerd pulls over HTTPS with a certificate
it already trusts. TLS terminates here; in-cluster TLS is registry.tls.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
  {{- with .Values.registry.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.registry.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.registry.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "kube-oci-composer.publicHostname" . | quote }}
      {{- /* Only when named; a default certificate or cert-manager annotation needs none. */}}
      {{- with .Values.registry.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ include "kube-oci-composer.publicHostname" . | quote }}
      http:
        paths:
          {{- /* The whole API: a /v2/-scoped route passes the version check and then fails. */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                # The READ Service; pushes use the write Service over cluster DNS.
                name: {{ include "kube-oci-composer.registryFullname" . }}-read
                port:
                  number: {{ .Values.registry.service.port }}
{{- end }}
