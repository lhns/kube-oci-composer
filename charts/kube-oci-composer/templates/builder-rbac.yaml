{{- if .Values.imageBuild.enabled }}
{{/*
Kept deliberately readable. This role is the difference between this component and the composer,
whose role cannot create a single object — so it is worth being able to read in one screen.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
rules:
  - apiGroups: [oci.lhns.de]
    resources: [imagebuilds]
    verbs: [get, list, watch]
  - apiGroups: [oci.lhns.de]
    resources: [imagebuilds/status]
    verbs: [get, update, patch]
  # Creating Jobs is the ability to run arbitrary containers. This is the permission that makes
  # this a separate component rather than a flag on the composer.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # get, create and update -- but NOT list or watch, which is the part that matters. This controller
  # can only touch Secrets whose names it already knows; it cannot enumerate a namespace's.
  #
  # create and update exist for one thing: a short-lived copy of the operator's registry credential
  # in the namespace a build runs in. A pod can only mount Secrets from its own namespace, and the
  # build must run in the object's -- it mounts that namespace's build secrets and runs its code.
  # The copy is owned by the ImageBuild and goes with it.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, buckets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-oci-composer.builderFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-oci-composer.builderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.imageBuild.leaderElect }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-oci-composer.builderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
