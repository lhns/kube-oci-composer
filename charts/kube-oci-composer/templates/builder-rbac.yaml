{{- if .Values.imageBuild.enabled }}
{{/*
Kept readable on one screen: this role (it can create Jobs) is what separates the builder from the
composer.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
rules:
  # patch: the finalizer below is added and removed by patching the object, only for an ImageBuild
  # that exports into ANOTHER namespace (such a ConfigMap cannot be owner-referenced). ADR 0056.
  - apiGroups: [oci.lhns.de]
    resources: [imagebuilds]
    verbs: [get, list, watch, patch]
  - apiGroups: [oci.lhns.de]
    resources: [imagebuilds/finalizers]
    verbs: [update]
  - apiGroups: [oci.lhns.de]
    resources: [imagebuilds/status]
    verbs: [get, update, patch]
  # Creating Jobs is running arbitrary containers: the reason this is a separate component.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # No list or watch: only Secrets whose names it already knows. create/update are for a copy of
  # the operator's registry credential in the build's namespace (a pod mounts Secrets only from its
  # own); the copy is owned by the ImageBuild.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
  # Watched, so an edit to a spec.dockerfile.configMapRef rebuilds promptly. The write verbs are
  # push.writeRefTo's and cluster-wide because RBAC precedes the object; the controller is the
  # boundary (own namespace or --ref-export-namespaces, deletes only its own labelled ConfigMaps).
  # ADR 0056. No deletecollection.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, buckets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-oci-composer.builderFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-oci-composer.builderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.imageBuild.leaderElect }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-oci-composer.builderFullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-oci-composer.builderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
