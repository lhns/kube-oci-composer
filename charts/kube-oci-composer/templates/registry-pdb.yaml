{{- if and .Values.registry.enabled .Values.registry.podDisruptionBudget.enabled (gt (int .Values.registry.readReplicas) 0) }}
{{- /*
Keeps a drain from evicting every registry pod at once. Not rendered without read replicas: 1-of-1
can never be satisfied and would block every drain.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  minAvailable: {{ .Values.registry.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- /* Every pod serving pulls, not just the writer. */}}
      {{- include "kube-oci-composer.registryServeSelectorLabels" . | nindent 6 }}
{{- end }}
