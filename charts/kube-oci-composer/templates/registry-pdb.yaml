{{- if and .Values.registry.enabled .Values.registry.podDisruptionBudget.enabled .Values.registry.cluster.enabled (gt (int .Values.registry.cluster.replicaCount) 1) }}
{{- /*
Replicas alone do not survive a drain.

`kubectl drain` evicts every pod it is asked to, and with nothing objecting it will happily take
all of them in the same second -- which is the scenario this whole feature exists for. The replica
count makes the registry survivable; this file is what makes it survive.

NOT RENDERED at one replica, deliberately. minAvailable 1 against a single replica can never be
satisfied, so it blocks every drain forever: the node never cordons, a cluster upgrade stalls, and
nothing in the events names a PodDisruptionBudget as the reason. A budget that cannot be met is
worse than no budget.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  minAvailable: {{ .Values.registry.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry") | nindent 6 }}
{{- end }}
