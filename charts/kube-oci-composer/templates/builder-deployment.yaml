{{- if .Values.imageBuild.enabled }}
{{/*
A nicer error than the controller's, which refuses to start on the same condition. Both images'
digests are part of every build's input hash, so a floating tag would let an upgraded builder
change output without changing the hash. See ADR 0025.
*/}}
{{- range $field, $image := dict "buildkitImage" .Values.imageBuild.buildkitImage "dockerfileFrontend" .Values.imageBuild.dockerfileFrontend }}
{{- if not (contains "@sha256:" $image) }}
{{- fail (printf "builder.%s must be pinned by digest (repo:tag@sha256:...). See ADR 0025." $field) }}
{{- end }}
{{- end }}
{{/*
fetcherImage is checked only when SET, unlike the two above, and the difference is what it is.
Those are third-party images an operator chooses; this one is this operator's own binary, and left
empty it is the image this very chart is deploying. Demanding a digest for it would mean looking one
up for an image the chart already picked. Pinned by TAG it still moves with the chart's appVersion,
so a released unpack fix does reach the input hash -- what it does not catch is the same tag being
republished with different content.
*/}}
{{- if and .Values.imageBuild.fetcherImage (not (contains "@sha256:" .Values.imageBuild.fetcherImage)) }}
{{- fail "imageBuild.fetcherImage must be pinned by digest when set explicitly (repo:tag@sha256:...); leave it empty to use this chart's own builder image." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
spec:
  replicas: {{ .Values.imageBuild.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "builder") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-oci-composer.builderServiceAccountName" . }}
      {{- /* image.pullSecrets, not imagePullSecrets -- the latter is not a key this chart has, so
      this block silently rendered nothing and the builder could never use a pull secret. */}}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.imageBuild.image.repository }}:{{ .Values.imageBuild.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imageBuild.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.imageBuild.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.imageBuild.healthProbeBindAddress }}
            - --leader-elect={{ .Values.imageBuild.leaderElect }}
            - --buildkit-image={{ .Values.imageBuild.buildkitImage }}
            - --dockerfile-frontend={{ .Values.imageBuild.dockerfileFrontend }}
            - --fetcher-image={{ include "kube-oci-composer.fetcherImage" . }}
            {{- if .Values.imageBuild.fetchDenyPrivate }}
            - --fetch-deny-private
            {{- end }}
            - --source-date-epoch={{ .Values.imageBuild.sourceDateEpoch }}
            {{- include "kube-oci-composer.registryArgs" (dict "ctx" $ "supplyChain" .Values.imageBuild.supplyChain) | trim | nindent 12 }}
            - --keep-builds={{ .Values.imageBuild.keepBuilds }}
            - --retention-refresh-interval={{ .Values.imageBuild.retention.refreshInterval }}
            {{- if .Values.imageBuild.requirePinnedSources }}
            - --require-pinned-sources
            {{- end }}
          env:
            # The default push credential is read from the CONTROLLER's namespace, not the
            # object's: it belongs to the operator, not to a tenant. See ADR H.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ include "kube-oci-composer.port" .Values.imageBuild.metricsBindAddress }}
            - name: probes
              containerPort: {{ include "kube-oci-composer.port" .Values.imageBuild.healthProbeBindAddress }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.imageBuild.resources | nindent 12 }}
          {{- with (include "kube-oci-composer.registryCAVolumeMount" $) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "kube-oci-composer.registryCAVolume" $) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
