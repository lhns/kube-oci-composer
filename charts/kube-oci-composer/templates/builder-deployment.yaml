{{- if .Values.imageBuild.enabled }}
{{/*
Mirrors the controller's startup check with a clearer error: both digests are in every build's input
hash, so a floating tag could change output without changing the hash. ADR 0025.
*/}}
{{- range $field, $image := dict "buildkitImage" .Values.imageBuild.buildkitImage "dockerfileFrontend" .Values.imageBuild.dockerfileFrontend }}
{{- if not (contains "@sha256:" $image) }}
{{- fail (printf "imageBuild.%s must be pinned by digest (repo:tag@sha256:...). See ADR 0025." $field) }}
{{- end }}
{{- end }}
{{/*
fetcherImage is checked only when set: left empty it is this chart's own builder image, pinned by
tag to appVersion, which still moves the input hash on upgrade.
*/}}
{{- if and .Values.imageBuild.fetcherImage (not (contains "@sha256:" .Values.imageBuild.fetcherImage)) }}
{{- fail "imageBuild.fetcherImage must be pinned by digest when set explicitly (repo:tag@sha256:...); leave it empty to use this chart's own builder image." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
spec:
  replicas: {{ .Values.imageBuild.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "builder") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-oci-composer.builderServiceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.imageBuild.image.repository }}:{{ .Values.imageBuild.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imageBuild.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.imageBuild.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.imageBuild.healthProbeBindAddress }}
            - --context-bind-address={{ .Values.imageBuild.contextBindAddress }}
            {{- /* Used by build pods in any namespace: Service DNS, never localhost. */}}
            - --context-base-url=http://{{ include "kube-oci-composer.builderFullname" . }}-context.{{ .Release.Namespace }}.svc.{{ .Values.registry.clusterDomain }}:{{ include "kube-oci-composer.port" .Values.imageBuild.contextBindAddress }}
            - --leader-elect={{ .Values.imageBuild.leaderElect }}
            - --buildkit-image={{ .Values.imageBuild.buildkitImage }}
            - --dockerfile-frontend={{ .Values.imageBuild.dockerfileFrontend }}
            - --fetcher-image={{ include "kube-oci-composer.fetcherImage" . }}
            {{- if .Values.imageBuild.fetchDenyPrivate }}
            - --fetch-deny-private
            {{- end }}
            - --source-date-epoch={{ .Values.imageBuild.sourceDateEpoch }}
            {{- include "kube-oci-composer.registryArgs" (dict "ctx" $ "supplyChain" .Values.imageBuild.supplyChain) | trim | nindent 12 }}
            - --keep-builds={{ .Values.imageBuild.keepBuilds }}
            - --retention-refresh-interval={{ include "kube-oci-composer.builderRefreshInterval" . }}
            - --build-poll-interval={{ .Values.imageBuild.buildPollInterval }}
            {{- with include "kube-oci-composer.refExportArgs" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.imageBuild.requirePinnedSources }}
            - --require-pinned-sources
            {{- end }}
          env:
            # The default push credential is read from the CONTROLLER's namespace: it belongs to
            # the operator, not to a tenant.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: context
              containerPort: {{ include "kube-oci-composer.port" .Values.imageBuild.contextBindAddress }}
            - name: metrics
              containerPort: {{ include "kube-oci-composer.port" .Values.imageBuild.metricsBindAddress }}
            - name: probes
              containerPort: {{ include "kube-oci-composer.port" .Values.imageBuild.healthProbeBindAddress }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.imageBuild.resources | nindent 12 }}
          {{- with (include "kube-oci-composer.registryCAVolumeMount" $) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "kube-oci-composer.registryCAVolume" $) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
