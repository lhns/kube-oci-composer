{{- if .Values.imageBuild.enabled }}
{{- /*
Where build pods fetch their Flux source (ADR 0044). Separate from the metrics Service: this one is
reached from every namespace that owns an ImageBuild, and gets its own NetworkPolicy.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-context
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: context
      port: {{ include "kube-oci-composer.port" .Values.imageBuild.contextBindAddress }}
      targetPort: context
      protocol: TCP
  selector:
    {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
{{- if .Values.imageBuild.networkPolicy.enabled }}
---
{{- /*
A CONNECTIVITY guarantee, like the registry's: build Jobs run in their object's namespace and a
default-deny cluster would block the fetch. Reaching it is not reading it -- every request carries a
per-build token. Once a policy selects the builder pod, only what is listed here is allowed.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-oci-composer.builderFullname" . }}-context
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "builder") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "builder") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ include "kube-oci-composer.port" .Values.imageBuild.contextBindAddress }}
      from:
        {{- include "kube-oci-composer.namespaceIngressFrom"
            (dict "allowed" .Values.imageBuild.networkPolicy.allowedNamespaces
                  "namespace" .Release.Namespace) | trim | nindent 8 }}
{{- end }}
{{- end }}
