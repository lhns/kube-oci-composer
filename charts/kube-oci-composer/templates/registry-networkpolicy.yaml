{{- if and .Values.registry.enabled .Values.registry.networkPolicy.enabled }}
{{- /*
A CONNECTIVITY guarantee, not a security control (reads are anonymous by design, threat I5; writes
need the password): build Jobs push from their object's namespace. Once selected, the registry pod
admits only what is listed, so this must be complete. Kubelet pulls come from the node network and
need nodeCIDRs.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- /* Writer and read replicas alike, or default-deny blackholes the replicas. */}}
      {{- include "kube-oci-composer.registryServeSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.registry.service.port }}
      from:
        {{- include "kube-oci-composer.namespaceIngressFrom"
            (dict "allowed" .Values.registry.networkPolicy.allowedNamespaces
                  "namespace" .Release.Namespace) | trim | nindent 8 }}
        {{- /* Node traffic, for kubelet image pulls. */}}
        {{- range .Values.registry.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
