{{- if and .Values.registry.enabled .Values.registry.networkPolicy.enabled }}
{{- /*
This is a CONNECTIVITY GUARANTEE, not a security control, and the distinction is the whole reason
it is shaped the way it is.

Restricting which namespace may reach the registry buys nothing that is not already bought: reads
are anonymous by design (threat I5) because a kubelet pulls without credentials, and writes need
the generated password. A namespace boundary in front of that adds no authority to either rule.

What it DOES buy is builds that work. A build Job runs in its object's namespace, not this one, so
every build crosses a namespace boundary to push -- and in a cluster with a default-deny policy,
nothing lets it through. That is the failure this exists to prevent, and it is why the default is
permissive rather than tight.

READ THIS BEFORE NARROWING IT. The moment any policy selects the registry pod, that pod goes from
"no policy applies, so everything is allowed" to "only what is listed is allowed". So this file has
to be COMPLETE, not merely correct. In particular:

  * Image pulls come from the KUBELET, in the NODE's network namespace. No podSelector can ever
    match them -- there is no pod. That is what `nodeCIDRs` is for, and leaving it empty on a
    cluster where pods and nodes are on different networks turns every pull into a timeout that
    looks exactly like a broken registry.
  * Build pods live in namespaces this chart has never heard of, created after it was installed.

If you narrow `allowedNamespaces`, you are asserting that you know every namespace a build will
ever run in. That is a real thing to know and a bad thing to guess.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-oci-composer.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.componentLabels" (dict "ctx" . "component" "registry") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-oci-composer.componentSelectorLabels" (dict "ctx" . "component" "registry") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.registry.service.port }}
      from:
        {{- if .Values.registry.networkPolicy.allowedNamespaces }}
        {{- range .Values.registry.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- /*
        The release's own namespace is added unconditionally when the list is narrowed: both
        controllers live here and both talk to the registry constantly, so omitting it would stop
        publishing and -- worse -- stop the retention refresh, whose silence deletes images one
        window later (ADR 0031).
        */}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
        {{- else }}
        {{- /*
        Every namespace. An empty namespaceSelector matches all of them, which is the default
        because a build can land anywhere and this policy's job is to let it through.
        */}}
        - namespaceSelector: {}
        {{- end }}
        {{- /*
        Node traffic, for kubelet image pulls. Not a pod, so not selectable any other way.
        */}}
        {{- range .Values.registry.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
