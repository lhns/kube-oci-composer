{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled requires ingress.host" }}
{{- end }}
{{- if ne .Values.ingress.host .Values.operator.servingHost }}
{{- /*
Not fatal, because an intermediate proxy may legitimately differ. But status.artifact.ref is built
from operator.servingHost, so if these disagree the controller publishes references that do not
resolve through this ingress.
*/}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-oci-composer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-composer.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # containerd only ever talks to /v2/. Narrowing the path keeps the metrics and probe
          # endpoints off the public listener.
          - path: /v2/
            pathType: Prefix
            backend:
              service:
                name: {{ include "kube-oci-composer.fullname" . }}
                port:
                  name: oci
{{- end }}
