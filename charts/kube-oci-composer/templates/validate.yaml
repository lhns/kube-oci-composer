{{- /*
Renders nothing; it exists to RUN the checks. Helm never renders _partials, so an `include` inside one
is dead code, and a template whose output is only whitespace is dropped. `fail` still aborts
template, install and upgrade.
*/}}
{{- include "kube-oci-composer.checkPublishMode" . -}}
{{- include "kube-oci-composer.checkRetention" . -}}
{{- include "kube-oci-composer.checkUntaggedWindow" . -}}
{{- include "kube-oci-composer.checkDerivedFloors" . -}}
{{- include "kube-oci-composer.checkGcInterval" . -}}
{{- include "kube-oci-composer.checkRegistryAuth" . -}}
{{- include "kube-oci-composer.checkRegistryCert" . -}}
{{- include "kube-oci-composer.checkRegistryReplicas" . -}}
{{- include "kube-oci-composer.checkRegistryMigration" . -}}

{{- /* Moved in 0.6.0. Refused rather than ignored: ignored, a lengthened window silently fell back to the default and content was collected sooner. */}}
{{- if hasKey .Values.registry.retention "window" }}
{{- fail "registry.retention.window moved to retention.window in 0.6.0, where both controllers and the registry read it. Set retention.window instead and remove registry.retention.window." }}
{{- end }}

{{- /* An empty readTimeout renders no key and zot injects 60s (ADR 0047). */}}
{{- if and .Values.registry.enabled (not .Values.registry.readTimeout) }}
{{- fail "registry.readTimeout must be set: leaving it empty makes zot apply its own 60s limit to the WHOLE request, including time queued behind the upload lock, so large layers become unpushable. See ADR 0047." }}
{{- end }}
