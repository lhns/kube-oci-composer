apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-oci-builder.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-builder.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.buildServiceAccount.create }}
---
# The account BUILD PODS run as. Deliberately bound to nothing: a pod running code from a git
# repository must not carry the controller's token, and it has no reason to talk to the API server
# at all. See ADR 0025.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-oci-builder.buildServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oci-builder.labels" . | nindent 4 }}
  {{- with .Values.buildServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
