# kube-oci-builder
#
# A SEPARATE chart on purpose. Installing the composer must not imply that a controller which can
# create Jobs — that is, run arbitrary containers — exists in your cluster. ADR 0004 and ADR 0025
# both turn on that point, and it is why this is not a flag on the composer's chart.
#
# Read ADR 0025 before installing this. The kind it enables makes a deliberately weaker promise
# than ImageComposition: its output digest is an observation recorded in status rather than a
# function of its spec, and it is not bit-reproducible.

replicaCount: 1

image:
  repository: ghcr.io/lhns/kube-oci-builder
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

builder:
  # The rootless BuildKit image, PINNED BY DIGEST.
  #
  # The controller REFUSES TO START if this is not pinned, and that is not pedantry: this digest is
  # part of every build's input hash, playing the role AssemblyVersion plays for the composer. With
  # a floating tag, an upgraded BuildKit would produce different output under an unchanged hash and
  # the controller would keep serving the old artifact forever — the exact failure ADR 0002
  # describes. Bumping it rebuilds every DockerBuild in the cluster, which is correct and is the
  # cost of the guarantee.
  buildkitImage: "moby/buildkit:v0.17.2-rootless@sha256:5b45405a38c579692f6fcd47ceef2002fe4fa61bb04ef0c2c644cf74cbbd57b8"

  # The Dockerfile frontend, PINNED BY DIGEST. BuildKit resolves `# syntax=` over the network
  # unless it is told exactly what to use.
  dockerfileFrontend: "docker/dockerfile:1.12.1@sha256:93bfd3b68c109427185cd78b4779fc82b484b0b7618e36d0f104d4d801e66d25"

  # SOURCE_DATE_EPOCH stamped into builds. Fixed rather than the wall clock, matching the epoch the
  # composer stamps on every layer — a real timestamp would make two builds of one commit differ
  # for no reason anybody cares about.
  sourceDateEpoch: "0"

  # How many past builds to retain in status.
  keepBuilds: 10

  # Leader election. A build is a Job, so a second controller would at worst adopt the same Job
  # rather than run a second build — but leave this on to keep status writes single-writer.
  leaderElect: true

serviceAccount:
  name: ""
  annotations: {}

# There is no build service account here on purpose.
#
# A ServiceAccount is namespaced and builds run in their own object's namespace, so one created by
# this chart could never have been reachable from them. What the guarantee actually needs is that a
# build pod carries no API token, and the controller sets automountServiceAccountToken: false on
# every build pod that does not name an account. Set spec.serviceAccountName on a DockerBuild only
# when a build genuinely needs an identity — that opts the token back in.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# The CONTROLLER's posture. Unchanged from the composer's, and it stays that way precisely because
# this controller does not build anything itself — it creates a Job and watches it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

metrics:
  bindAddress: ":8080"
  serviceMonitor:
    enabled: false

healthProbe:
  bindAddress: ":8081"
